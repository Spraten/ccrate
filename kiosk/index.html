<script>
const view=document.querySelector('#view'),status=document.querySelector('#status');let browseFilter={condition:'',location:'',manufacturer:'',type:'',available:false,archived:false},stockRows=null,stockHeld=new Set();let scanPurpose=null;let photoStream=null,photoOverlay=null;let kitDraft=null,checkoutKitVersions={},returnKitVersions={};let problemMode=false,problemDraft=null;let enrollment=null;let inventory=[],checkoutMode=false,checkoutCart=[],checkoutKey=null,checkoutBusy=false,returnMode=false,returnCart=[],returnAvailable=[],returnKey=null,returnBusy=false,returnDestinationFor=null;
const actions=[['Check Out','Take equipment with you'],['Return','Bring equipment back'],['Find Item','Search names and locations'],['Browse Stock','Explore the inventory'],['Workshop','Explore locations and equipment'],['Add Equipment','Enroll and label an asset']];
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function home(){scanPurpose=null;stopPhoto();kitDraft=null;checkoutKitVersions={};returnKitVersions={};problemMode=false;problemDraft=null;enrollment=null;returnMode=false;returnCart=[];returnKey=null;returnDestinationFor=null;checkoutMode=false;checkoutCart=[];checkoutKey=null;closeKeyboard();view.replaceChildren(node('h1','What would you like to do?'));const grid=node('div',undefined,'grid');actions.forEach(([title,description])=>{const b=node('button',undefined,'action');b.append(node('strong',title),node('span',description));b.onclick=()=>open(title);grid.append(b)});view.append(grid)}
function heading(title){closeKeyboard();view.replaceChildren();const row=node('div',undefined,'toolbar'),back=node('button','← Home');back.onclick=home;row.append(back,node('h1',title));view.append(row)}
function list(query=''){const results=document.querySelector('#results');results.replaceChildren();const source=stockRows||inventory;const matching=source.filter(e=>[e.name,e.assetId,e.parent?.name,e.serialNumber,e.modelNumber,e.manufacturer,e.entityType?.name,e.description,...(e.tags||[]).map(t=>t.name)].join(' ').toLowerCase().includes(query.toLowerCase())&&(browseFilter.archived||!e.archived)&&(!browseFilter.condition||e.condition===browseFilter.condition)&&(!browseFilter.location||(e.parent?.name||'No location')===browseFilter.location)&&(!browseFilter.manufacturer||e.manufacturer===browseFilter.manufacturer)&&(!browseFilter.type||e.entityType?.name===browseFilter.type)&&(!browseFilter.available||(e.condition==='Ready'&&!e.archived&&e.quantity===1&&!stockHeld.has(e.id))));if(!matching.length){results.append(node('p',inventory.length?'No matching equipment.':'No equipment loaded.'));return}matching.forEach(e=>{const b=node('button',undefined,'item');b.append(node('strong',e.name),node('small',(e.assetId||'')+' · '+(e.parent?.name||'No location')+(e.condition?' · '+e.condition:'')));b.onclick=()=>detail(e);results.append(b)})}
async function detail(e){if(e.entityType?.isLocation){locationDetail(e);return}heading(e.name);const box=node('div',undefined,'notice');box.append(node('p','Asset: '+e.assetId),node('p','Location: '+(e.parent?.name||'Not assigned')),node('p','Quantity: '+e.quantity),node('p',e.description||'No description'));const link=node('a','Open in Homebox');link.href='http://127.0.0.1:17745/item/'+encodeURIComponent(e.id);link.target='_blank';const map=node('button','Show on map');map.style='padding:0 18px;margin-left:12px;background:#dce6ee';map.onclick=()=>showMap(e);box.append(link,map,primary('Label preview',()=>showLabel(e)));view.append(box);try{const response=await fetch('/api/entity?id='+encodeURIComponent(e.id));const data=await response.json();if(!response.ok)throw Error(data.error||'Could not read condition');if(!box.isConnected)return;box.append(node('p','Condition: '+data.condition));const custody=await(await fetch('/api/custody')).json();if(!box.isConnected)return;if(Array.isArray(custody)){const held=custody.find(c=>c.entity_id===e.id);box.append(node('p',held?'Checked out by: '+held.borrower:'Available · no current borrower'))}if(data.blocker)box.append(node('p','Checkout blocked: '+data.blocker));const history=node('button','Activity history');history.style='padding:0 18px;margin-right:12px;background:#dce6ee';history.onclick=()=>showHistory(e);box.append(history,primary('Maintenance & inspections',()=>showMaintenance(e)),primary('Photos & files',()=>showFiles(data.entity)));const review=node('button','Review condition');review.style='background:#dce6ee;padding:0 18px';review.onclick=()=>reviewCondition(data.entity,data.states);box.append(review)}catch(error){if(box.isConnected)box.append(node('p',error.message))}}
function reviewCondition(e,states){heading('Review: '+e.name);view.append(node('p','Setup Admin · check the equipment before marking it Ready.'));const grid=node('div',undefined,'grid');for(const state of states){const b=node('button',state);b.style='background:white;border:1px solid #a3b6c5;padding:10px';b.onclick=()=>{heading('Confirm condition');const conditionKey=crypto.randomUUID();const box=node('div',undefined,'notice');box.append(node('p',e.name+' → '+state));if(state==='Trashed')box.append(node('p','The equipment record is retained for history.'));const confirm=node('button','Confirm '+state);confirm.style='background:#245c89;color:white;padding:0 18px';confirm.onclick=async()=>{confirm.disabled=true;try{const response=await fetch('/condition',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_id:e.id,state,request_key:conditionKey})});const data=await response.json();if(!response.ok)throw Error(data.reason||'Could not update condition');await detail(data.entity);status.textContent='Condition saved in Homebox';load()}catch(error){box.append(node('p',error.message));confirm.disabled=false}};const cancel=node('button','Cancel');cancel.style='margin-left:12px;padding:0 18px';cancel.onclick=()=>detail(e);box.append(confirm,cancel);view.append(box)};grid.append(b)}view.append(grid)}
function open(title){if(title==='Workshop'){home();showMap();return}if(title==='Report Problem'){startProblem();return}if(title==='Add Equipment'){startEnrollment();return}if(title==='Return'){returnMode=true;startReturn();return}if(title==='Check Out'){checkoutMode=true;renderCheckout();return}if(title==='Find Item'||title==='Browse Stock'){browseStock(title);return}heading(title);const box=node('div',undefined,'notice');box.append(node('span','Workflow preview', 'tag'),node('p',title+' is the next workflow to design.'),node('p','This screen does not change inventory. Identity, permissions and transaction rules will be reviewed before operations are enabled.'));view.append(box)}
document.querySelector('#report-problem').onclick=()=>{home();startProblem()};
document.querySelector('#admin').onclick=async()=>{heading('Administration');const box=node('div',undefined,'notice');box.append(node('p','Setup mode: Admin is temporarily open.'));const recovery=node('button','Review interrupted operations');recovery.style='padding:0 18px;margin-right:12px;background:#dce6ee';recovery.onclick=showRecovery;const activity=node('button','Activity history');activity.style='padding:0 18px;background:#dce6ee';activity.onclick=()=>showHistory();const maps=node('button','Workshop map editor');maps.style='padding:0 18px;margin:8px 12px 8px 0;background:#dce6ee';maps.onclick=()=>showMapEditor();box.append(primary('Import CSV',importWizard),primary('Equipment categories',categoryManager),primary('Kit manifests',kitManager),primary('System status & backup',showSystem),primary('Create Homebox account',accountForm),primary('Locations',locationManager),primary('Offline products',catalogManager),maps,recovery,activity);view.append(box);
try{const members=await(await fetch('/api/members')).json();if(!Array.isArray(members))throw Error('Homebox unavailable');box.append(node('h1','Issue a badge'));for(const member of members){const b=node('button','Issue badge: '+member.name);b.style='display:block;width:100%;margin:8px 0;background:#dce6ee';b.onclick=async()=>{b.disabled=true;try{const response=await fetch('/badge/issue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:member.id})});if(!response.ok)throw Error('Badge issue failed');const badge=await response.json();heading('Badge: '+member.name);const panel=node('div',undefined,'notice');panel.append(node('p','This badge identifies this native Homebox member. Keep it with that person.'));const img=node('img');img.src=badge.qr;img.alt='Person badge QR';img.style='width:220px;height:220px';panel.append(img);const printKey=crypto.randomUUID(),print=primary('Print one badge',async()=>{print.disabled=true;try{await api('/badge/print',{badge_id:badge.id,code:badge.code,request_key:printKey});panel.append(node('p','Printer confirmed badge completion. Inspect the result.'))}catch(e){panel.append(node('p',e.message))}});panel.append(print);const revoke=node('button','Revoke this badge');revoke.onclick=async()=>{await fetch('/badge/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:badge.id})});status.textContent='Badge revoked';home();updateIdentity()};panel.append(revoke);view.append(panel)}catch(e){box.append(node('p',e.message));b.disabled=false}};box.append(b)}
const existing=await(await fetch('/api/badges')).json();if(existing.length){box.append(node('h1','Existing badges'));for(const badge of existing){const name=members.find(m=>m.id===badge.user_id)?.name||'Former member';const b=node('button',(badge.revoked?'Revoked: ':'Revoke: ')+name);b.disabled=!!badge.revoked;b.style='display:block;width:100%;margin:8px 0;background:#dce6ee';b.onclick=async()=>{await fetch('/badge/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:badge.id})});document.querySelector('#admin').click();updateIdentity()};box.append(b)}}}catch(e){box.append(node('p',e.message))}
};
async function load(){try{const r=await fetch('/api/inventory');if(!r.ok)throw Error('Homebox unavailable');inventory=await r.json();status.textContent='Homebox connected · '+inventory.length+' assets';}catch(e){status.textContent='Homebox unavailable · retry';status.onclick=load}}
document.querySelector('#desktop').onclick=()=>{
const overlay=node('div');overlay.style='position:fixed;inset:0;background:#183348dd;display:flex;align-items:center;justify-content:center;z-index:10';
const box=node('div',undefined,'notice');box.style='width:440px;padding:24px';box.append(node('h1','Return to the desktop?'),node('p','The kiosk can be reopened with the desktop shortcut.'));
const row=node('div',undefined,'toolbar'),stay=node('button','Stay here'),leave=node('button','Open desktop');stay.onclick=()=>overlay.remove();leave.style='background:#245c89;color:white';leave.onclick=async()=>{try{const result=await fetch('/exit',{method:'POST'});if(!result.ok)throw Error();}catch(e){box.append(node('p','Could not close the kiosk. Please try again.'))}};row.append(stay,leave);box.append(row);overlay.append(box);document.body.append(overlay);
};





function svgNode(tag,attributes={},text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value] of Object.entries(attributes))n.setAttribute(key,String(value));if(text!==undefined)n.textContent=text;return n}
async function showMap(entity=null){heading('Workshop map');const panel=node('div');panel.append(node('p','Loading native locations…'));view.append(panel);try{const response=await fetch('/api/map'+(entity?'?entity='+encodeURIComponent(entity.id):''));const data=await response.json();if(!response.ok)throw Error(data.error||'Map unavailable');if(!panel.isConnected)return;panel.replaceChildren();if(data.path.length)panel.append(node('p',data.path.map(p=>p.name).join(' › ')));if(!data.rooms.length){const places=(await api('/api/locations')).filter(p=>!p.archived);if(!panel.isConnected)return;const workshop=places.find(p=>/workshop/i.test(p.name)),byId=new Map(places.map(p=>[p.id,p]));function inWorkshop(place){const seen=new Set();let current=place;while(current?.parent&&!seen.has(current.id)){seen.add(current.id);if(current.parent.id===workshop?.id)return true;current=byId.get(current.parent.id)}return false}const children=workshop?places.filter(inWorkshop):[],mockPlaces=children.length?children:places.filter(p=>p.id!==workshop?.id);if(!mockPlaces.length){panel.append(node('p','Add your workshop locations to start building the layout.'),primary('Add workshop locations',locationManager));return}const room={id:'workshop-preview',name:workshop?.name||'Workshop',width:12,height:Math.max(4,Math.ceil(mockPlaces.length/3)*2)};data.rooms=[room];data.objects=mockPlaces.map((p,i)=>({id:p.id,name:p.name,room_id:room.id,x:(i%3)*4,y:Math.floor(i/3)*2,width:4,height:2,type:/quarantine/i.test(p.name)?'Quarantine Area':/maintenance/i.test(p.name)?'Maintenance Area':/charging/i.test(p.name)?'Charging Station':/cage/i.test(p.name)?'Cage':'Location'}));panel.append(node('p','Workshop mockup · automatic arrangement, not the actual floor plan. Tap a location to see its equipment.'),primary('Arrange workshop layout',()=>showMapEditor()));}else{panel.append(node('p','Tap a location to see its equipment.'))}const rooms=node('div',undefined,'toolbar');rooms.style.flexWrap='wrap';for(const room of data.rooms){const b=node('button',room.name);b.onclick=()=>draw(room);rooms.append(b)}if(data.rooms.length>1)panel.append(rooms);const drawing=node('div');panel.append(drawing);
function draw(room){drawing.replaceChildren();const title=view.querySelector('.toolbar h1');if(title)title.textContent='Map: '+room.name;const objects=data.objects.filter(o=>o.room_id===room.id),selected=objects.find(o=>o.id===data.highlight_id);if(entity){drawing.append(node('p',selected?(data.exact?'Highlighted shelf: ':'Mapped area: ')+selected.name:'The assigned shelf has not been placed on this room map.'))}const svg=svgNode('svg',{viewBox:'0 0 760 210',role:'img','aria-label':room.name+' workshop layout'});svg.style='display:block;width:100%;height:210px;background:white;border:2px solid #7892a5;border-radius:8px';for(let x=1;x<room.width;x++)svg.append(svgNode('line',{x1:x*760/room.width,x2:x*760/room.width,y1:0,y2:210,stroke:'#e4ebf0'}));for(let y=1;y<room.height;y++)svg.append(svgNode('line',{x1:0,x2:760,y1:y*210/room.height,y2:y*210/room.height,stroke:'#e4ebf0'}));
for(const object of objects){const highlighted=object.id===data.highlight_id,x=object.x*760/room.width+4,y=object.y*210/room.height+4,w=object.width*760/room.width-8,h=object.height*210/room.height-8;const group=svgNode('g',{'data-location-id':object.id,'data-highlighted':highlighted,role:'button','aria-label':'Location '+object.name,tabindex:0});const fill=highlighted?'#ffe7a2':object.type==='Quarantine Area'?'#f6d8d8':object.type==='Maintenance Area'?'#f8e6c7':'#dce9f0';group.append(svgNode('rect',{x,y,width:w,height:h,rx:5,fill,stroke:highlighted?'#a35d08':'#7892a5','stroke-width':highlighted?4:1}));group.append(svgNode('text',{x:x+w/2,y:y+h/2+5,'text-anchor':'middle','font-family':'system-ui','font-size':14,fill:'#183348'},object.name.length>Math.floor(w/8)?object.name.slice(0,Math.max(3,Math.floor(w/8)-1))+'…':object.name));const select=()=>locationDetail({id:object.id,name:object.name});group.onclick=select;group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}};svg.append(group)}drawing.append(svg);const list=node('div',undefined,'items');list.style.marginTop='12px';for(const object of objects){const b=node('button',undefined,'item');if(object.id===data.highlight_id)b.style.border='3px solid #a35d08';b.append(node('strong',object.name),node('small',object.type));b.onclick=()=>locationDetail({id:object.id,name:object.name});list.append(b)}drawing.append(list)}draw(data.rooms.find(r=>r.id===data.room_id)||data.rooms[0]);}catch(error){if(panel.isConnected)panel.replaceChildren(node('p',error.message))}}
async function locationDetail(location){heading(location.name);const panel=node('div');panel.append(node('p','Homebox location'));const map=node('button','Show on map');map.style='padding:0 18px;background:#dce6ee';map.onclick=()=>showMap(location);panel.append(map,primary('Label preview',()=>showLabel(location)));view.append(panel);try{const places=await(await fetch('/api/locations')).json();if(!panel.isConnected)return;if(!Array.isArray(places))throw Error('Locations unavailable');const byId=new Map([...places,...inventory].map(e=>[e.id,e]));function here(entity){const seen=new Set();let current=entity;while(current?.parent&&!seen.has(current.id)){seen.add(current.id);if(current.parent.id===location.id)return true;current=byId.get(current.parent.id)}return false}const items=inventory.filter(e=>!e.archived&&here(e));panel.append(node('h1','Equipment here'));const list=node('div',undefined,'items');for(const e of items){const b=node('button',e.name,'item');b.onclick=()=>detail(e);list.append(b)}if(!items.length)list.append(node('p','No active equipment assigned here.'));panel.append(list)}catch(error){if(panel.isConnected)panel.append(node('p',error.message))}}
async function showMapEditor(selectedRoom=null){heading('Workshop map editor');const panel=node('div');panel.append(node('p','Loading native map…'));view.append(panel);try{const response=await fetch('/api/map');const data=await response.json();const places=await(await fetch('/api/locations')).json();if(!response.ok||!Array.isArray(places))throw Error(data.error||'Map unavailable');if(!panel.isConnected)return;panel.replaceChildren();const room=data.rooms.find(r=>r.id===selectedRoom);if(!room){panel.append(node('p','Choose an existing Homebox location as a room. No layout is assumed.'));for(const r of data.rooms){const b=node('button','Edit room: '+r.name);b.style='display:block;width:100%;margin:8px 0;background:#dce6ee';b.onclick=()=>showMapEditor(r.id);panel.append(b)}for(const place of places.filter(p=>!p.archived&&!data.rooms.some(r=>r.id===p.id))){const b=node('button','Use as room: '+place.name);b.style='display:block;width:100%;margin:8px 0;background:white';b.onclick=()=>editMapRoom(place,{width:10,height:6});panel.append(b)}return}
panel.append(node('h1',room.name),node('p',room.width+' columns × '+room.height+' rows'));const preview=node('button','Preview room map');preview.style='padding:0 18px;background:#dce6ee';preview.onclick=()=>showMap({id:room.id,name:room.name});const resize=node('button','Edit room size / name');resize.style='padding:0 18px;background:#dce6ee;margin-left:12px';resize.onclick=()=>editMapRoom(room,room);panel.append(preview,resize,node('h1','Place or edit a location'));const byId=new Map(places.map(p=>[p.id,p]));function belongs(place){const seen=new Set();let current=place;while(current?.parent&&!seen.has(current.id)){seen.add(current.id);if(current.parent.id===room.id)return true;current=byId.get(current.parent.id)}return false}for(const place of places.filter(p=>!p.archived&&p.id!==room.id&&belongs(p))){const existing=data.objects.find(o=>o.id===place.id);const b=node('button',(existing?'Edit: ':'Place: ')+place.name);b.style='display:block;width:100%;margin:8px 0;background:white';b.onclick=()=>editMapObject(place,room,existing||{room_id:room.id,x:0,y:0,width:1,height:1,type:'Shelf'});panel.append(b)}if(data.errors.length)panel.append(node('p','Some native map fields require review in Homebox.'));}catch(error){if(panel.isConnected)panel.replaceChildren(node('p',error.message))}}
function nameInput(entity,draft){const input=node('input');input.value=draft.name||entity.name;input.maxLength=255;input.readOnly=true;input.inputMode='none';input.setAttribute('aria-label','Location name');input.onclick=()=>touchKeyboard(input,{title:'Location name',done:'Done'});input.oninput=()=>draft.name=input.value;return input}

async function renderEnrollment(message=''){
heading('Add equipment');if(!identified){view.append(node('p','Scan your badge before adding equipment.'),primary('Scan badge',()=>document.querySelector('#scan').click()));return}if(!enrollment)startEnrollment();const draft=enrollment,panel=node('div',undefined,'notice');panel.append(node('p','One individually tracked asset. New equipment stays Unreviewed until checked.'));touchField(panel,'Product barcode',draft,'gtin');panel.append(primary('Look up barcode',()=>lookupEnrollment(draft.gtin)),primary('Scan product or location',()=>{scanPurpose=null;document.querySelector('#scan').click()}),primary('Scan serial number',()=>{scanPurpose='serial';document.querySelector('#scan').click()}));for(const [label,key] of [['Equipment name','name'],['Serial number','serial'],['Manufacturer','manufacturer'],['Model','model'],['Description','description']])touchField(panel,label,draft,key);const select=node('select');select.style='font:inherit;padding:12px;width:100%;margin:10px 0';select.setAttribute('aria-label','Storage location');select.append(new Option('Choose storage location',''));try{for(const e of await api('/api/locations'))if(!e.archived)select.append(new Option(e.name,e.id))}catch(e){panel.append(node('p',e.message))}if(enrollment!==draft)return;select.value=draft.location_id||'';select.onchange=()=>draft.location_id=select.value||null;panel.append(node('p','Assigned storage location'),select);const types=await api('/api/types');const category=node('select');category.setAttribute('aria-label','Equipment category');category.style='font:inherit;padding:12px;width:100%;margin:10px 0';for(const type of types.filter(t=>!t.isLocation&&!t.name.startsWith('Pending kiosk type ')))category.append(new Option(type.name,type.id));category.value=draft.type_id||category.options[0]?.value||'';draft.type_id=category.value;category.onchange=()=>draft.type_id=category.value;panel.append(node('p','Equipment category'),category);photoControls(panel,draft,()=>renderEnrollment());panel.append(primary('Inspected and Ready: '+(draft.reviewed?'Yes':'No'),()=>{draft.reviewed=!draft.reviewed;renderEnrollment()}));if(draft.gtin&&!draft.template_id)panel.append(primary('Save these product defaults',()=>productForm({gtin:draft.gtin,name:draft.name,manufacturer:draft.manufacturer,model:draft.model,description:draft.description,mpn:''},crypto.randomUUID(),lookupEnrollment)));const save=primary('Review equipment',()=>reviewEnrollment());panel.append(save);if(message)panel.append(node('p',message));view.append(panel)}
function reviewEnrollment(){const draft=enrollment;if(!draft)return;heading('Confirm equipment');const panel=node('div',undefined,'notice');panel.append(node('h1',draft.name||'Name required'),node('p','Serial: '+(draft.serial||'Not supplied')),node('p','Condition: '+(draft.reviewed?'Ready — physically inspected':'Unreviewed — checkout blocked')),node('p','Storage: '+(draft.location_id?'Selected Homebox location':'Location required')));const save=primary('Confirm add equipment',async()=>{const generation=identityGeneration,instance=identityInstance;save.disabled=true;try{const result=await api('/enroll/confirm',{request_key:draft.key,input:draft,session_generation:generation,session_instance:instance});if(generation!==identityGeneration||instance!==identityInstance)return;enrollment=null;identityGeneration=generation+1;identified=false;await updateIdentity();await load();await detail((await api('/api/entity?id='+result.entity_id)).entity);status.textContent='Equipment saved in Homebox · session ended'}catch(e){panel.append(node('p',e.message));save.disabled=false}});panel.append(save,primary('Back',()=>renderEnrollment()));view.append(panel)}

async function maybeKit(entity,mode){const generation=identityGeneration;const kit=await api('/api/kit?id='+entity.id);if(generation!==identityGeneration)return true;if(!kit.kit)return false;kitDraft={...kit,mode,verified:new Set(kit.verified||[])};renderKit();return true}
function renderKit(message=''){if(!kitDraft)return;const draft=kitDraft;heading('Verify kit: '+draft.root.name);view.append(node('p','Scan the kit and every expected component. Verified '+draft.entities.filter(e=>draft.verified.has(e.id)).length+' of '+draft.entities.length+'.'));const list=node('div',undefined,'items');for(const e of draft.entities){const card=node('div',undefined,'notice');card.append(node('strong',(draft.verified.has(e.id)?'✓ ':'○ ')+e.name));const blocker=draft.blockers.find(b=>b.id===e.id);if(blocker&&draft.mode==='checkout')card.append(node('p',blocker.reason));list.append(card)}view.append(list,primary('Scan kit or component',()=>document.querySelector('#scan').click()));const ready=draft.entities.every(e=>draft.verified.has(e.id));const add=primary('Use verified kit',()=>{if(draft.mode==='checkout'){for(const e of draft.entities)if(!checkoutCart.some(a=>a.id===e.id))checkoutCart.push(e);Object.assign(checkoutKitVersions,draft.versions);checkoutKey=null;kitDraft=null;renderCheckout()}else{for(const e of draft.entities)if(!returnCart.some(t=>t.entity.id===e.id))returnCart.push({entity:e,previous:e.archived?'Archived':(e.fields?.find(f=>f.name==='Equipment condition')?.textValue||'Unreviewed'),condition:null,destination_id:null,note:null});Object.assign(returnKitVersions,draft.versions);returnKey=null;kitDraft=null;renderReturn()}});add.disabled=!ready||(draft.mode==='checkout'&&draft.blockers.length>0);view.append(add,primary('Cancel kit',()=>{kitDraft=null;draft.mode==='checkout'?renderCheckout():renderReturn()}));if(message)view.append(node('p',message))}
async function kitManager(){heading('Kit manifests');view.append(node('p','Choose the kit container. Expected components remain native records and keep their existing location.'));for(const e of inventory.filter(e=>!e.archived&&e.quantity===1)){const b=node('button',e.name,'item');b.style='width:100%;margin:6px 0';b.onclick=()=>kitEditor(e);view.append(b)}}
async function kitEditor(entity){const kit=await api('/api/kit?id='+entity.id);const selected=new Set(kit.root.fields?.filter(f=>f.name==='Equipment kit manifest').flatMap(f=>JSON.parse(f.textValue).members)||[]);function render(){heading('Kit contents: '+entity.name);view.append(node('p','Expected direct components: '+selected.size+'. Nested kits are included when scanned.'));const save=primary('Save kit manifest',async()=>{save.disabled=true;try{await api('/kit/save',{entity_id:entity.id,members:[...selected]});status.textContent='Kit manifest saved in Homebox';kitManager()}catch(e){view.append(node('p',e.message));save.disabled=false}});view.append(save);const list=node('div',undefined,'items');for(const e of inventory.filter(e=>e.id!==entity.id&&!e.archived&&e.quantity===1)){const b=node('button',(selected.has(e.id)?'✓ ':'')+e.name,'item');b.onclick=()=>{selected.has(e.id)?selected.delete(e.id):selected.add(e.id);render()};list.append(b)}view.append(list)}render()}


function stopPhoto(){if(photoStream)photoStream.getTracks().forEach(t=>t.stop());photoStream=null;if(photoOverlay)photoOverlay.remove();photoOverlay=null}
async function capturePhoto(draft,onDone){stopScan();stopPhoto();const overlay=node('div');photoOverlay=overlay;overlay.style='position:fixed;inset:0;z-index:15;background:#183348;padding:12px;display:flex;flex-direction:column;gap:8px';const row=node('div',undefined,'toolbar'),cancel=node('button','Cancel photo'),capture=node('button','Capture photo');cancel.onclick=stopPhoto;capture.disabled=true;row.append(cancel,capture);const video=node('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.style='flex:1;min-height:0;object-fit:contain;width:100%';overlay.append(row,video);document.body.append(overlay);try{const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:10,max:15}},audio:false});if(photoOverlay!==overlay){stream.getTracks().forEach(t=>t.stop());return}photoStream=stream;video.srcObject=stream;await video.play();capture.disabled=false;capture.onclick=()=>{const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;canvas.getContext('2d').drawImage(video,0,0,640,480);draft.photo=canvas.toDataURL('image/jpeg',.8);stopPhoto();onDone()}}catch(e){if(photoOverlay===overlay)overlay.append(node('p','Camera unavailable. Cancel to continue without a photo.'))}}
function photoControls(panel,draft,onDone){panel.append(primary(draft.photo?'Retake equipment photo':'Add equipment photo',()=>capturePhoto(draft,onDone)));if(draft.photo){const image=node('img');image.src=draft.photo;image.alt='Equipment photo to save in Homebox';image.style='display:block;width:240px;margin:8px 0';panel.append(image,primary('Remove photo',()=>{draft.photo=null;onDone()}))}}
