<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment terminal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#182a38;font:18px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;min-height:52px}button:focus-visible,input:focus-visible{outline:3px solid #eaab27;outline-offset:2px}header{height:65px;background:#183348;color:white;padding:10px 16px;display:flex;align-items:center;gap:14px}header strong{font-size:23px}header span{font-size:15px;color:#dce6ee}header button{margin-left:auto;padding:0 18px;background:#dce6ee;color:#183348;min-height:44px}main{padding:15px 18px;height:365px;overflow:auto}h1{font-size:25px;margin:0 0 12px}p{margin:9px 0;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.action{height:133px;background:white;border:1px solid #c8d2db;box-shadow:0 2px 3px #18334812;text-align:left;padding:20px;color:#183348}.action strong{display:block;font-size:24px}.action span{display:block;margin-top:10px;font-size:16px;color:#526575}.action:first-child{background:#176653;color:white}.action:first-child span{color:#d4eee5}.action:nth-child(2){background:#245c89;color:white}.action:nth-child(2) span{color:#dbeafa}footer{height:50px;display:flex;gap:12px;align-items:center;padding:0 18px;border-top:1px solid #ccd6dd;background:white;font-size:15px}#status{margin-left:auto}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:12px}.toolbar button{padding:0 18px;background:#dce6ee}.toolbar h1{margin:0}input{width:100%;padding:12px;border:1px solid #a3b6c5;border-radius:8px;margin-bottom:10px}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:white;border:1px solid #ccd6dd;padding:12px;border-radius:8px;text-align:left;color:#183348}.item small{display:block;font-size:15px;color:#536574;margin-top:6px}.notice{background:white;border:1px solid #c8d2db;border-radius:9px;padding:18px}.tag{background:#f7e8b6;color:#56420c;padding:5px 9px;border-radius:5px;font-size:15px}a{color:#205c89}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.action{height:110px}main{height:calc(100vh - 115px)}header span{display:none}}
</style>
<header><strong>Equipment terminal</strong><span>Prototype · demo inventory</span><button id="admin">Admin</button><button id="desktop" style="margin-left:0">Desktop</button></header>
<main id="view"></main><footer><span>Session: no user identified</span><span id="status" role="status">Loading Homebox…</span></footer>
<script>
const view=document.querySelector('#view'),status=document.querySelector('#status');let inventory=[];
const actions=[['Check Out','Take equipment with you'],['Return','Bring equipment back'],['Find Item','Search names and locations'],['Browse Stock','Explore the inventory'],['Report Problem','Record an equipment issue'],['Add Equipment','Enroll and label an asset']];
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function home(){view.replaceChildren(node('h1','What would you like to do?'));const grid=node('div',undefined,'grid');actions.forEach(([title,description])=>{const b=node('button',undefined,'action');b.append(node('strong',title),node('span',description));b.onclick=()=>open(title);grid.append(b)});view.append(grid)}
function heading(title){view.replaceChildren();const row=node('div',undefined,'toolbar'),back=node('button','← Home');back.onclick=home;row.append(back,node('h1',title));view.append(row)}
function list(query=''){const results=document.querySelector('#results');results.replaceChildren();const matching=inventory.filter(e=>[e.name,e.assetId,e.parent?.name].join(' ').toLowerCase().includes(query.toLowerCase()));if(!matching.length){results.append(node('p',inventory.length?'No matching equipment.':'No equipment loaded.'));return}matching.forEach(e=>{const b=node('button',undefined,'item');b.append(node('strong',e.name),node('small',(e.assetId||'')+' · '+(e.parent?.name||'No location')));b.onclick=()=>detail(e);results.append(b)})}
function detail(e){heading(e.name);const box=node('div',undefined,'notice');box.append(node('p','Asset: '+e.assetId),node('p','Location: '+(e.parent?.name||'Not assigned')),node('p','Quantity: '+e.quantity),node('p',e.description||'No description'));const link=node('a','Open in Homebox');link.href='http://127.0.0.1:17745';link.target='_blank';box.append(link);view.append(box)}
function open(title){heading(title);if(title==='Find Item'||title==='Browse Stock'){const input=node('input');input.placeholder='Search equipment or location';input.setAttribute('aria-label','Search equipment or location');input.oninput=()=>list(input.value);view.append(input,node('div',undefined,'items'));view.lastChild.id='results';list();return}const box=node('div',undefined,'notice');box.append(node('span','Workflow preview', 'tag'),node('p',title+' is the next workflow to design.'),node('p','This screen does not change inventory. Identity, permissions and transaction rules will be reviewed before operations are enabled.'));view.append(box)}
document.querySelector('#admin').onclick=()=>{heading('Administration');const box=node('div',undefined,'notice');box.append(node('p','Homebox holds the inventory. This companion makes common tasks easier.'),node('p','Camera and printer hardware tests accepted.'),node('p','Prototype: no production login, scanning or inventory changes enabled.'));const a=node('a','Open Homebox administration');a.href='http://127.0.0.1:17745';a.target='_blank';box.append(a);view.append(box)};
async function load(){try{const r=await fetch('/api/inventory');if(!r.ok)throw Error('Homebox unavailable');inventory=await r.json();status.textContent='Homebox connected · '+inventory.length+' assets';}catch(e){status.textContent='Homebox unavailable · retry';status.onclick=load}}
document.querySelector('#desktop').onclick=()=>{
const overlay=node('div');overlay.style='position:fixed;inset:0;background:#183348dd;display:flex;align-items:center;justify-content:center;z-index:10';
const box=node('div',undefined,'notice');box.style='width:440px;padding:24px';box.append(node('h1','Return to the desktop?'),node('p','The kiosk can be reopened with the desktop shortcut.'));
const row=node('div',undefined,'toolbar'),stay=node('button','Stay here'),leave=node('button','Open desktop');stay.onclick=()=>overlay.remove();leave.style='background:#245c89;color:white';leave.onclick=async()=>{try{const result=await fetch('/exit',{method:'POST'});if(!result.ok)throw Error();}catch(e){box.append(node('p','Could not close the kiosk. Please try again.'))}};row.append(stay,leave);box.append(row);overlay.append(box);document.body.append(overlay);
};
home();load();
</script></html>
