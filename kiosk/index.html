<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment terminal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#182a38;font:18px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;min-height:52px}button:focus-visible,input:focus-visible{outline:3px solid #eaab27;outline-offset:2px}header{height:65px;background:#183348;color:white;padding:10px 16px;display:flex;align-items:center;gap:14px}header strong{font-size:23px}header span{font-size:15px;color:#dce6ee}header button{margin-left:auto;padding:0 18px;background:#dce6ee;color:#183348;min-height:44px}main{padding:15px 18px;height:365px;overflow:auto}h1{font-size:25px;margin:0 0 12px}p{margin:9px 0;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.action{height:133px;background:white;border:1px solid #c8d2db;box-shadow:0 2px 3px #18334812;text-align:left;padding:20px;color:#183348}.action strong{display:block;font-size:24px}.action span{display:block;margin-top:10px;font-size:16px;color:#526575}.action:first-child{background:#176653;color:white}.action:first-child span{color:#d4eee5}.action:nth-child(2){background:#245c89;color:white}.action:nth-child(2) span{color:#dbeafa}footer{height:50px;display:flex;gap:12px;align-items:center;padding:0 18px;border-top:1px solid #ccd6dd;background:white;font-size:15px}#status{margin-left:auto}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:12px}.toolbar button{padding:0 18px;background:#dce6ee}.toolbar h1{margin:0}input{width:100%;padding:12px;border:1px solid #a3b6c5;border-radius:8px;margin-bottom:10px}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:white;border:1px solid #ccd6dd;padding:12px;border-radius:8px;text-align:left;color:#183348}.item small{display:block;font-size:15px;color:#536574;margin-top:6px}.notice{background:white;border:1px solid #c8d2db;border-radius:9px;padding:18px}.tag{background:#f7e8b6;color:#56420c;padding:5px 9px;border-radius:5px;font-size:15px}a{color:#205c89}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.action{height:110px}main{height:calc(100vh - 115px)}header span{display:none}}
</style>
<header><strong>Equipment terminal</strong><span>Demo inventory</span><button id="scan">Scan</button><button id="admin">Admin</button><button id="desktop" style="margin-left:0">Desktop</button></header>
<main id="view"></main><footer><button id="end-session" style="display:none;min-height:40px;padding:0 10px">End session</button><span id="identity">Scan badge to identify yourself</span><span id="status" role="status">Loading Homebox…</span></footer>
<script>
const view=document.querySelector('#view'),status=document.querySelector('#status');let inventory=[],checkoutMode=false,checkoutCart=[],checkoutKey=null,checkoutBusy=false,returnMode=false,returnCart=[],returnAvailable=[],returnKey=null,returnBusy=false,returnDestinationFor=null;
const actions=[['Check Out','Take equipment with you'],['Return','Bring equipment back'],['Find Item','Search names and locations'],['Browse Stock','Explore the inventory'],['Report Problem','Record an equipment issue'],['Add Equipment','Enroll and label an asset']];
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function home(){returnMode=false;returnCart=[];returnKey=null;returnDestinationFor=null;checkoutMode=false;checkoutCart=[];checkoutKey=null;closeKeyboard();view.replaceChildren(node('h1','What would you like to do?'));const grid=node('div',undefined,'grid');actions.forEach(([title,description])=>{const b=node('button',undefined,'action');b.append(node('strong',title),node('span',description));b.onclick=()=>open(title);grid.append(b)});view.append(grid)}
function heading(title){closeKeyboard();view.replaceChildren();const row=node('div',undefined,'toolbar'),back=node('button','← Home');back.onclick=home;row.append(back,node('h1',title));view.append(row)}
function list(query=''){const results=document.querySelector('#results');results.replaceChildren();const matching=inventory.filter(e=>[e.name,e.assetId,e.parent?.name].join(' ').toLowerCase().includes(query.toLowerCase()));if(!matching.length){results.append(node('p',inventory.length?'No matching equipment.':'No equipment loaded.'));return}matching.forEach(e=>{const b=node('button',undefined,'item');b.append(node('strong',e.name),node('small',(e.assetId||'')+' · '+(e.parent?.name||'No location')));b.onclick=()=>detail(e);results.append(b)})}
async function detail(e){heading(e.name);const box=node('div',undefined,'notice');box.append(node('p','Asset: '+e.assetId),node('p','Location: '+(e.parent?.name||'Not assigned')),node('p','Quantity: '+e.quantity),node('p',e.description||'No description'));const link=node('a','Open in Homebox');link.href='http://127.0.0.1:17745';link.target='_blank';box.append(link);view.append(box);try{const response=await fetch('/api/entity?id='+encodeURIComponent(e.id));const data=await response.json();if(!response.ok)throw Error(data.error||'Could not read condition');if(!box.isConnected)return;box.append(node('p','Condition: '+data.condition));const custody=await(await fetch('/api/custody')).json();if(!box.isConnected)return;if(Array.isArray(custody)){const held=custody.find(c=>c.entity_id===e.id);box.append(node('p',held?'Checked out by: '+held.borrower:'Available · no current borrower'))}if(data.blocker)box.append(node('p','Checkout blocked: '+data.blocker));const history=node('button','Activity history');history.style='padding:0 18px;margin-right:12px;background:#dce6ee';history.onclick=()=>showHistory(e);box.append(history);const review=node('button','Review condition');review.style='background:#dce6ee;padding:0 18px';review.onclick=()=>reviewCondition(data.entity,data.states);box.append(review)}catch(error){if(box.isConnected)box.append(node('p',error.message))}}
function reviewCondition(e,states){heading('Review: '+e.name);view.append(node('p','Setup Admin · check the equipment before marking it Ready.'));const grid=node('div',undefined,'grid');for(const state of states){const b=node('button',state);b.style='background:white;border:1px solid #a3b6c5;padding:10px';b.onclick=()=>{heading('Confirm condition');const box=node('div',undefined,'notice');box.append(node('p',e.name+' → '+state));if(state==='Trashed')box.append(node('p','The equipment record is retained for history.'));const confirm=node('button','Confirm '+state);confirm.style='background:#245c89;color:white;padding:0 18px';confirm.onclick=async()=>{confirm.disabled=true;try{const response=await fetch('/condition',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_id:e.id,state})});const data=await response.json();if(!response.ok)throw Error(data.reason||'Could not update condition');await detail(data.entity);status.textContent='Condition saved in Homebox';load()}catch(error){box.append(node('p',error.message));confirm.disabled=false}};const cancel=node('button','Cancel');cancel.style='margin-left:12px;padding:0 18px';cancel.onclick=()=>detail(e);box.append(confirm,cancel);view.append(box)};grid.append(b)}view.append(grid)}
function open(title){if(title==='Return'){returnMode=true;startReturn();return}if(title==='Check Out'){checkoutMode=true;renderCheckout();return}heading(title);if(title==='Find Item'||title==='Browse Stock'){const input=node('input');input.placeholder='Search equipment or location';input.setAttribute('aria-label','Search equipment or location');input.readOnly=true;input.inputMode='none';input.onclick=()=>touchKeyboard(input);input.oninput=()=>list(input.value);view.append(input,node('div',undefined,'items'));view.lastChild.id='results';list();return}const box=node('div',undefined,'notice');box.append(node('span','Workflow preview', 'tag'),node('p',title+' is the next workflow to design.'),node('p','This screen does not change inventory. Identity, permissions and transaction rules will be reviewed before operations are enabled.'));view.append(box)}
document.querySelector('#admin').onclick=async()=>{heading('Administration');const box=node('div',undefined,'notice');box.append(node('p','Setup mode: Admin is temporarily open.'));const recovery=node('button','Review interrupted operations');recovery.style='padding:0 18px;margin-right:12px;background:#dce6ee';recovery.onclick=showRecovery;const activity=node('button','Activity history');activity.style='padding:0 18px;background:#dce6ee';activity.onclick=()=>showHistory();box.append(recovery,activity);view.append(box);
try{const members=await(await fetch('/api/members')).json();if(!Array.isArray(members))throw Error('Homebox unavailable');box.append(node('h1','Issue a test badge'));for(const member of members){const b=node('button','Issue badge: '+member.name);b.style='display:block;width:100%;margin:8px 0;background:#dce6ee';b.onclick=async()=>{b.disabled=true;try{const response=await fetch('/badge/issue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:member.id})});if(!response.ok)throw Error('Badge issue failed');const badge=await response.json();heading('Test badge: '+member.name);const panel=node('div',undefined,'notice');panel.append(node('p','Temporary test badge. Show this QR to the kiosk camera from another screen.'));const img=node('img');img.src=badge.qr;img.alt='Test badge QR';img.style='width:220px;height:220px';panel.append(img);const revoke=node('button','Revoke this badge');revoke.onclick=async()=>{await fetch('/badge/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:badge.id})});status.textContent='Badge revoked';home();updateIdentity()};panel.append(revoke);view.append(panel)}catch(e){box.append(node('p',e.message));b.disabled=false}};box.append(b)}
const existing=await(await fetch('/api/badges')).json();if(existing.length){box.append(node('h1','Existing badges'));for(const badge of existing){const name=members.find(m=>m.id===badge.user_id)?.name||'Former member';const b=node('button',(badge.revoked?'Revoked: ':'Revoke: ')+name);b.disabled=!!badge.revoked;b.style='display:block;width:100%;margin:8px 0;background:#dce6ee';b.onclick=async()=>{await fetch('/badge/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:badge.id})});document.querySelector('#admin').click();updateIdentity()};box.append(b)}}}catch(e){box.append(node('p',e.message))}
};
async function load(){try{const r=await fetch('/api/inventory');if(!r.ok)throw Error('Homebox unavailable');inventory=await r.json();status.textContent='Homebox connected · '+inventory.length+' assets';}catch(e){status.textContent='Homebox unavailable · retry';status.onclick=load}}
document.querySelector('#desktop').onclick=()=>{
const overlay=node('div');overlay.style='position:fixed;inset:0;background:#183348dd;display:flex;align-items:center;justify-content:center;z-index:10';
const box=node('div',undefined,'notice');box.style='width:440px;padding:24px';box.append(node('h1','Return to the desktop?'),node('p','The kiosk can be reopened with the desktop shortcut.'));
const row=node('div',undefined,'toolbar'),stay=node('button','Stay here'),leave=node('button','Open desktop');stay.onclick=()=>overlay.remove();leave.style='background:#245c89;color:white';leave.onclick=async()=>{try{const result=await fetch('/exit',{method:'POST'});if(!result.ok)throw Error();}catch(e){box.append(node('p','Could not close the kiosk. Please try again.'))}};row.append(stay,leave);box.append(row);overlay.append(box);document.body.append(overlay);
};




async function startReturn(){renderReturn();try{const response=await fetch('/api/custody');const data=await response.json();if(!response.ok||!Array.isArray(data))throw Error('Could not read current custody');if(!returnMode)return;returnAvailable=data;renderReturn()}catch(error){if(returnMode)renderReturn(error.message)}}
function renderReturn(message=''){
heading('Return');if(!identified){view.append(node('p','Scan your badge. You may return equipment for a colleague.'));const badge=node('button','Scan badge');badge.style='padding:0 24px;background:#245c89;color:white';badge.onclick=()=>document.querySelector('#scan').click();view.append(badge);return}
view.append(node('p','Keep the recorded condition and assigned shelf, or report a change.'));
const cart=node('div',undefined,'notice');cart.append(node('strong','Returning: '+returnCart.length));for(const item of returnCart){const card=node('div');card.style='padding:10px 0;border-bottom:1px solid #ccd6dd';card.append(node('strong',item.entity.name),node('p','Previous condition: '+item.previous),node('p','Return condition: '+(item.condition||item.previous)),node('p','Destination: '+(item.destinationName||item.entity.parent?.name||'Scan a destination')));
const row=node('div',undefined,'toolbar');for(const [label,fn] of [['Condition',()=>returnCondition(item)],['Change destination',()=>{returnDestinationFor=item.entity.id;document.querySelector('#scan').click()}],['Remove',()=>{returnCart=returnCart.filter(t=>t.entity.id!==item.entity.id);returnKey=null;renderReturn()}]]){const b=node('button',label);b.disabled=returnBusy;b.onclick=fn;row.append(b)}card.append(row);
if(item.destination_id){const reset=node('button','Keep assigned shelf');reset.disabled=returnBusy;reset.onclick=()=>{item.destination_id=null;item.destinationName=null;returnKey=null;renderReturn()};card.append(reset)}
if(item.condition){const input=node('input');input.placeholder='Optional issue note';input.setAttribute('aria-label','Issue note for '+item.entity.name);input.value=item.note||'';input.maxLength=1000;input.readOnly=true;input.inputMode='none';input.onclick=()=>touchKeyboard(input,{title:'Return issue note',done:'Done'});input.oninput=()=>{item.note=input.value;returnKey=null};card.append(input)}cart.append(card)}
const confirm=node('button',returnBusy?'Confirming…':'Confirm return');confirm.disabled=!returnCart.length||returnBusy;confirm.style='padding:0 24px;background:#245c89;color:white';confirm.onclick=confirmReturn;cart.append(confirm);view.append(cart);if(message)view.append(node('p',message));const scan=node('button','Scan returned equipment');scan.disabled=returnBusy;scan.style='margin:12px 0;padding:0 24px;background:#dce6ee';scan.onclick=()=>{returnDestinationFor=null;document.querySelector('#scan').click()};view.append(scan,node('h1','Or choose checked-out equipment'));const choices=node('div',undefined,'items');for(const held of returnAvailable){if(returnCart.some(t=>t.entity.id===held.entity_id))continue;const entity=inventory.find(e=>e.id===held.entity_id);const b=node('button',undefined,'item');b.disabled=returnBusy;b.append(node('strong',entity?.name||held.entity_id),node('small','Borrower: '+held.borrower));b.onclick=()=>addReturn(entity||{id:held.entity_id});choices.append(b)}if(!choices.children.length)choices.append(node('p','No other checked-out equipment.'));view.append(choices);
}
function returnCondition(item){heading('Condition on return');view.append(node('p',item.entity.name+' · previously '+item.previous));const grid=node('div',undefined,'grid');for(const state of [null,'Needs Attention','Broken','Maintenance','Quarantined']){const b=node('button',state||'Unchanged: '+item.previous);b.style='padding:10px;background:white;border:1px solid #a3b6c5';b.onclick=()=>{item.condition=state;item.note=state?(item.note||''):null;returnKey=null;renderReturn()};grid.append(b)}view.append(grid,node('p','Admin review is required before blocked equipment becomes Ready again.'))}
async function addReturn(e){if(returnBusy)return;if(!identified){renderReturn('Scan your badge first');return}if(returnCart.some(t=>t.entity.id===e.id)){renderReturn('Already selected');return}try{const response=await fetch('/api/entity?id='+encodeURIComponent(e.id));const data=await response.json();if(!response.ok)throw Error(data.error||'Could not read asset');const custody=await(await fetch('/api/custody')).json();if(!returnMode||!identified)return;if(!Array.isArray(custody)||!custody.some(t=>t.entity_id===e.id)){renderReturn('This equipment is not checked out');return}if(data.entity.entityType?.isLocation||data.entity.quantity!==1){renderReturn('Select individually tracked equipment');return}if(returnCart.some(t=>t.entity.id===e.id))return;returnCart.push({entity:data.entity,previous:data.condition,condition:null,destination_id:null,note:null});returnKey=null;renderReturn()}catch(error){if(returnMode)renderReturn(error.message)}}
async function routeReturnEntity(e){if(returnDestinationFor){const item=returnCart.find(t=>t.entity.id===returnDestinationFor);returnDestinationFor=null;if(!e.entityType?.isLocation||e.archived){renderReturn('Scan an active Homebox location');return}if(item){item.destination_id=e.id;item.destinationName=e.name;returnKey=null}renderReturn();return}await addReturn(e)}
async function confirmReturn(){if(returnBusy||!identified||!returnCart.length)return;returnBusy=true;returnKey=returnKey||crypto.randomUUID();const targets=returnCart.map(t=>({entity_id:t.entity.id,condition:t.condition,destination_id:t.destination_id,note:t.note}));renderReturn();let failure='';try{const response=await fetch('/return/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targets,request_key:returnKey})});const data=await response.json();if(!response.ok)throw Error(data.error||'Return not confirmed');identified=false;home();document.querySelector('#identity').textContent='Scan badge to identify yourself';document.querySelector('#end-session').style.display='none';status.textContent='Returned '+data.count+' item'+(data.count===1?'':'s')+' · session ended'}catch(error){failure=error.message}finally{returnBusy=false;if(returnMode)renderReturn(failure)}}
async function showHistory(entity=null){heading('Activity history');try{const response=await fetch('/api/history'+(entity?'?entity='+encodeURIComponent(entity.id):''));const rows=await response.json();if(!response.ok)throw Error(rows.error||'History unavailable');if(entity)view.append(node('p',entity.name));if(!rows.length)view.append(node('p','No checkout or return activity.'));for(const row of rows){const card=node('div',undefined,'notice');card.style='margin-bottom:10px';card.append(node('strong',(row.action==='check_out'?'Checkout':'Return')+' · '+row.status),node('p',row.actor+' · '+new Date(row.created_at).toLocaleString()),node('p',row.assets.map(id=>inventory.find(e=>e.id===id)?.name||id).join(', ')));view.append(card)}}catch(error){view.append(node('p',error.message))}}
async function showRecovery(){heading('Interrupted operations');view.append(node('p','Setup Admin · inspect the physical equipment before choosing an outcome.'));try{const response=await fetch('/api/recovery');const rows=await response.json();if(!response.ok)throw Error(rows.error||'Recovery unavailable');const places=await(await fetch('/api/locations')).json();if(!rows.length)view.append(node('p','No interrupted operations.'));for(const row of rows){const card=node('div',undefined,'notice');card.style='margin-bottom:10px';card.append(node('strong',(row.action==='return'?'Return':'Checkout')+' · '+row.status),node('p','Operation '+row.id));for(const e of row.native_assets)card.append(node('p',e.name+' · '+(e.error||e.condition+' · '+e.parent)));for(const step of row.context?.steps||[])card.append(node('p','Planned: '+step.condition_after+' · destination '+(Array.isArray(places)?places.find(e=>e.id===step.parent_after)?.name||'Unknown destination':'Unknown destination')));for(const outcome of ['complete','cancel']){const b=node('button',outcome==='complete'?'Finish operation':'Cancel operation');b.style='padding:0 14px;margin-right:10px;background:#dce6ee';b.onclick=()=>confirmRecovery(row,outcome);card.append(b)}view.append(card)}}catch(error){view.append(node('p',error.message))}}
function confirmRecovery(row,outcome){heading('Confirm recovery');const card=node('div',undefined,'notice');card.append(node('p',(outcome==='complete'?'Finish':'Cancel')+' this '+(row.action==='return'?'return':'checkout')+'?'),node('p',row.native_assets.map(e=>e.name).join(', ')),node('p',outcome==='complete'?'Confirm that the physical equipment matches this transaction. Remaining native changes will be verified before custody is updated.':'Cancellation is allowed only when the return has made no native changes. Custody will remain as before.'));const b=node('button','Confirm '+(outcome==='complete'?'finish':'cancel'));b.style='padding:0 24px;background:#245c89;color:white';b.onclick=async()=>{b.disabled=true;try{const response=await fetch('/recovery/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:row.id,outcome})});const data=await response.json();if(!response.ok)throw Error(data.error||'Recovery failed');status.textContent='Operation '+data.status;showRecovery()}catch(error){card.append(node('p',error.message));b.disabled=false}};const back=node('button','Back');back.style='padding:0 24px;margin-left:12px';back.onclick=showRecovery;card.append(b,back);view.append(card)}

function renderCheckout(message=''){
heading('Check Out');if(!identified){view.append(node('p','Scan your badge before selecting equipment.'));const badge=node('button','Scan badge');badge.style='padding:0 24px;background:#245c89;color:white';badge.onclick=()=>document.querySelector('#scan').click();view.append(badge);return}
view.append(node('p','Assigned shelves stay unchanged. Only reviewed Ready equipment can be taken.'));
const cart=node('div',undefined,'notice');cart.append(node('strong','Selected: '+checkoutCart.length));for(const e of checkoutCart){const row=node('div',undefined,'toolbar');row.append(node('span',e.name));const remove=node('button','Remove '+e.name);remove.disabled=checkoutBusy;remove.onclick=()=>{checkoutCart=checkoutCart.filter(a=>a.id!==e.id);checkoutKey=null;renderCheckout()};row.append(remove);cart.append(row)}
const confirm=node('button',checkoutBusy?'Confirming…':'Confirm checkout');confirm.disabled=!checkoutCart.length||checkoutBusy;confirm.style='padding:0 24px;background:#176653;color:white';confirm.onclick=confirmCheckout;cart.append(confirm);view.append(cart);if(message)view.append(node('p',message));
const scan=node('button','Scan equipment');scan.style='margin:12px 0;padding:0 24px;background:#dce6ee';scan.disabled=checkoutBusy;scan.onclick=()=>document.querySelector('#scan').click();view.append(scan,node('h1','Or choose equipment'));const choices=node('div',undefined,'items');for(const e of inventory.filter(e=>!checkoutCart.some(a=>a.id===e.id))){const b=node('button',undefined,'item');b.disabled=checkoutBusy;b.append(node('strong',e.name),node('small',e.assetId+' · '+(e.parent?.name||'No assigned shelf')));b.onclick=()=>addCheckout(e);choices.append(b)}view.append(choices);
}
async function addCheckout(e){
if(checkoutBusy)return;if(!identified){renderCheckout('Scan your badge first');return}if(checkoutCart.some(a=>a.id===e.id)){renderCheckout('Already selected');return}
try{const response=await fetch('/api/entity?id='+encodeURIComponent(e.id));const data=await response.json();if(!response.ok)throw Error(data.error||'Could not read asset');if(!checkoutMode||!identified)return;if(data.blocker){renderCheckout(e.name+': '+data.blocker);return}const custody=await(await fetch('/api/custody')).json();if(!Array.isArray(custody))throw Error('Could not verify custody');if(!checkoutMode||!identified)return;const held=custody.find(c=>c.entity_id===e.id);if(held){renderCheckout(e.name+' is checked out by '+held.borrower);return}if(checkoutCart.some(a=>a.id===e.id))return;checkoutCart.push(data.entity);checkoutKey=null;renderCheckout()}catch(error){if(checkoutMode)renderCheckout(error.message)}
}
async function confirmCheckout(){
if(checkoutBusy||!identified||!checkoutCart.length)return;let failure='';checkoutBusy=true;checkoutKey=checkoutKey||crypto.randomUUID();const assets=checkoutCart.map(e=>e.id);renderCheckout();
try{const response=await fetch('/checkout/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assets,request_key:checkoutKey})});const data=await response.json();if(!response.ok)throw Error(data.error||'Checkout not confirmed');identified=false;home();document.querySelector('#identity').textContent='Scan badge to identify yourself';document.querySelector('#end-session').style.display='none';status.textContent='Checked out '+data.count+' item'+(data.count===1?'':'s')+' · session ended'}catch(error){failure=error.message}finally{checkoutBusy=false;if(checkoutMode)renderCheckout(failure)}
}

let keyboardOverlay=null;
function closeKeyboard(){if(keyboardOverlay)keyboardOverlay.remove();keyboardOverlay=null}
function touchKeyboard(input,options={}){
closeKeyboard();const overlay=node('div');keyboardOverlay=overlay;overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Touchscreen search keyboard');overlay.style='position:fixed;inset:0;background:#eef2f5;z-index:12;padding:12px;overflow:auto';
const row=node('div',undefined,'toolbar'),done=node('button',options.done||'Show results'),title=node('h1',options.title||'Search equipment');done.onclick=()=>{closeKeyboard();input.oninput()};row.append(done,title);overlay.append(row);
const display=node('output',input.value||'Tap keys to enter text');display.style='display:block;height:50px;overflow:auto;white-space:pre-wrap;padding:10px;background:white;border:1px solid #a3b6c5;border-radius:8px;margin-bottom:10px';display.setAttribute('aria-live','polite');overlay.append(display);
function edit(value){value=value.slice(0,input.maxLength>0?input.maxLength:1000);input.value=value;display.textContent=value||'Tap keys to enter text';input.oninput()}
for(const letters of ['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM-']){const keys=node('div');keys.style='display:flex;justify-content:center;gap:6px;margin-bottom:6px';for(const char of letters){const key=node('button',char);key.setAttribute('aria-label','Key '+char);key.style='width:68px;min-width:44px;min-height:52px;background:white;border:1px solid #a3b6c5';key.onclick=()=>edit(input.value+char.toLowerCase());keys.append(key)}overlay.append(keys)}
const controls=node('div');controls.style='display:flex;gap:10px';for(const [label,update] of [['Clear',()=> ''],['Space',()=>input.value+' '],['Backspace',()=>Array.from(input.value).slice(0,-1).join('')]]){const b=node('button',label);b.style='flex:1;background:#dce6ee';b.onclick=()=>edit(update());controls.append(b)}overlay.append(controls);document.body.append(overlay);done.focus();
}

let scanStream=null,scanTimer=null,scanBusy=false,scanOverlay=null;
function stopScan(){clearTimeout(scanTimer);scanTimer=null;if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null;if(scanOverlay)scanOverlay.remove();scanOverlay=null;}
async function routeScan(code,expectedOverlay=null){const response=await fetch('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});if(!response.ok)throw Error('Unable to read inventory');const data=await response.json();if(expectedOverlay&&scanOverlay!==expectedOverlay)return false;if(data.user){checkoutCart=[];checkoutKey=null;returnCart=[];returnKey=null;returnDestinationFor=null;identified=true;stopScan();document.querySelector('#identity').textContent=data.user.name;document.querySelector('#end-session').style.display='block';status.textContent='Badge accepted';if(checkoutMode)renderCheckout();else if(returnMode)startReturn();else home();return true}if(data.entity){stopScan();if(checkoutMode){await addCheckout(data.entity)}else if(returnMode){await routeReturnEntity(data.entity)}else detail(data.entity);status.textContent='Scan found: '+data.entity.name;return true}return data.reason||(data.kind==='product'?'Product barcode recognized. Offline catalog setup is still pending.':'Code not recognized');}
document.querySelector('#scan').onclick=async()=>{
closeKeyboard();stopScan();const overlay=node('div');scanOverlay=overlay;overlay.style='position:fixed;inset:0;background:#eef2f5;z-index:10;padding:14px';const row=node('div',undefined,'toolbar'),cancel=node('button','Cancel scan');cancel.onclick=()=>{stopScan();returnDestinationFor=null};row.append(cancel,node('h1','Scan badge, equipment or location'));overlay.append(row);const video=node('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.style='width:400px;height:300px;background:#182a38;object-fit:contain';const message=node('p','Starting camera…');message.setAttribute('role','status');overlay.append(video,message);document.body.append(overlay);
try{const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:10,max:10}},audio:false});if(scanOverlay!==overlay){stream.getTracks().forEach(t=>t.stop());return}scanStream=stream;video.srcObject=stream;message.textContent='Hold your badge or a Homebox QR code in front of the camera.';const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;let lastCode='',lastTime=0;
async function capture(){if(scanOverlay!==overlay)return;if(video.readyState>=2&&!scanBusy){scanBusy=true;try{canvas.getContext('2d').drawImage(video,0,0,640,480);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.7));const response=await fetch('/decode',{method:'POST',body:blob});if(!response.ok)throw Error('Decoder unavailable');const data=await response.json();if(scanOverlay!==overlay)return;for(const code of data.codes){if(code===lastCode&&Date.now()-lastTime<2000)continue;lastCode=code;lastTime=Date.now();const result=await routeScan(code,overlay);if(scanOverlay!==overlay)return;if(result===true)return;message.textContent=result}}catch(e){message.textContent=e.message}finally{scanBusy=false}}if(scanOverlay===overlay)scanTimer=setTimeout(capture,500)}capture();stream.getVideoTracks()[0].onended=()=>{message.textContent='Camera disconnected. Cancel and try again after reconnecting.';clearTimeout(scanTimer)};
}catch(e){message.textContent=e.name==='NotAllowedError'?'Camera permission needed. Allow camera access for this local kiosk.':e.name==='NotFoundError'?'Webcam not found. Reconnect it, then try again.':'Camera could not start: '+e.message}
};
window.addEventListener('pagehide',stopScan);

let identified=false,lastTouch=0;
for(const event of ['pointerdown','keydown'])document.addEventListener(event,()=>{if(!identified||Date.now()-lastTouch<1000)return;lastTouch=Date.now();fetch('/session/activity',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json()).then(d=>{if(!d.active)updateIdentity()}).catch(()=>{})});
setInterval(updateIdentity,3000);
async function updateIdentity(){try{const data=await(await fetch('/api/session')).json();const expired=identified&&!data.user;identified=!!data.user;if(expired){stopScan();home();status.textContent='Session ended · scan your badge again'}document.querySelector('#identity').textContent=data.user?data.user.name:'Scan badge to identify yourself';document.querySelector('#end-session').style.display=data.user?'block':'none'}catch(e){}}
document.querySelector('#end-session').onclick=async()=>{await fetch('/session/end',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});updateIdentity();home()};
home();load();updateIdentity();
</script></html>
