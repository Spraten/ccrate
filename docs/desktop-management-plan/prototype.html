<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workshop desktop workspace · Design preview</title>
<style>
:root{--paper:#f7f9fc;--ink:#263f52;--blue:#1f6292;--green:#17624a;--amber:#a35d08;--line:#d5dfe7}*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink)}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;background:white;border:1px solid #bacbd7;border-radius:5px;color:var(--ink);min-height:42px;padding:8px 14px}button:hover{background:#edf3f7}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd870e;outline-offset:3px}.main{background:var(--blue);color:white;border-color:var(--blue)}.main:hover{background:#174c73}.preview{background:#fff0cf;padding:9px 20px;color:#784700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.preview b{color:#553600}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 40px)}.rail{background:white;border-right:1px solid var(--line);padding:22px 16px}.brand{font-size:22px;line-height:1.1;margin:0 12px 12px}.group{margin:0 12px 25px;font-size:13px;color:#526e82}.rail nav button{display:block;width:100%;text-align:left;margin:4px 0;border:0;border-radius:5px}.rail nav button.selected{background:#e0edf5;color:#184f78;font-weight:600}.rail .native{margin-top:24px;border-top:1px solid var(--line);padding:18px 0}.role-note{font-size:12px;margin-top:16px;color:#607586}.workspace{min-width:0}.top{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 26px;gap:15px;flex-wrap:wrap}.top strong{font-weight:600}.top .identity{display:flex;align-items:center;gap:10px}.top select{padding:8px;border:1px solid var(--line);border-radius:4px;max-width:210px}main{padding:26px;max-width:1400px;margin:auto}h1{font-size:30px;line-height:1.2;margin:0}h2{font-size:19px;margin:0 0 12px}p{max-width:78ch}.title{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.title p{margin:8px 0 0;color:#566f82}.tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.tools input{width:280px;max-width:100%;border:1px solid #bacbd7;padding:10px 12px;border-radius:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:22px}.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}.attention{background:#fff4de;border-left:4px solid var(--amber);padding:16px 20px;margin-bottom:24px}.attention p{margin:0}.list{list-style:none;margin:0;padding:0}.list li{padding:14px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.sub{display:block;font-size:13px;color:#587286;margin-top:4px}.tag{display:inline-block;padding:4px 8px;border-radius:4px;background:#edf3f6;font-size:12px;white-space:nowrap}.tag.ready{color:var(--green);background:#e5f3ec}.tag.warn{color:#8b510a;background:#fff0d7}.tag.loan{background:#e3edf8;color:#1b537e}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#526e82;background:#f0f4f7;font-size:13px;font-weight:600}td,th{padding:13px 16px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f7fbfd}.name{font-weight:600;color:#1f6292}.name button{border:0;padding:0;background:none;min-height:30px;text-align:left;color:inherit;font-weight:inherit}.footnote{font-size:13px;color:#587286;margin-top:15px}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}.tabs button.active{background:#e0edf5;border-color:#8db1c9;color:#184f78}.timeline{border-left:2px solid #bfceda;margin-left:7px;padding-left:20px}.timeline article{margin-bottom:25px}.timeline p{margin:6px 0}.map{width:100%;height:360px;display:block;background:#f6fafc;border:1px solid var(--line)}.map rect[role=button]{cursor:pointer}.map rect[role=button]:hover{fill:#d1e6f0}.form label{display:block;font-weight:600;margin:12px 0 5px}.form input,.form select,.form textarea{display:block;width:100%;padding:10px;border:1px solid #bacbd7;border-radius:4px;font:inherit;color:var(--ink)}.form textarea{height:100px;resize:vertical}.form .hint{font-size:13px;color:#587286;font-weight:400;margin:5px 0 0}.steps{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.steps span{padding:8px 14px;border:1px solid var(--line);background:white;border-radius:4px}.steps .current{background:#e0edf5;border-color:#8db1c9}.right{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.empty{padding:35px;text-align:center;color:#587286}dialog{border:1px solid var(--line);border-radius:8px;padding:0;max-width:640px;width:calc(100% - 32px);max-height:92vh;color:var(--ink)}dialog::backdrop{background:#17384a99}.dialog-top{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.dialog-top h2{margin:0}.dialog-body{padding:22px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263f52;color:white;padding:15px 22px;border-radius:6px;z-index:10;max-width:90vw;box-shadow:0 3px 12px #17384a33}#mobile-nav{display:none}.readonly{background:#edf3f7;padding:12px}.label-preview{border:2px solid #263f52;padding:20px;text-align:center;margin-top:16px;max-width:300px;background:#fff}.label-preview .qr{width:70px;height:70px;background:repeating-conic-gradient(#263f52 0% 25%,white 0% 50%) 50% / 16px 16px;margin:8px auto}.label-preview small{display:block}.dialog-body .attention{margin-top:10px}.count{min-width:75px}.mobile-only{display:none}@media(max-width:1100px){.split{grid-template-columns:1fr}.app{grid-template-columns:190px minmax(0,1fr)}main{padding:20px}.two{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.rail{display:none}.top{padding:12px}.top .identity{width:100%;justify-content:space-between}#mobile-nav{display:block;width:100%;padding:10px;border:1px solid var(--line)}main{padding:16px}.title{align-items:flex-start;flex-direction:column;gap:10px}h1{font-size:26px}.preview{font-size:12px;padding:8px 12px}.tools input{width:100%}.panel{padding:16px}.map{height:300px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="preview"><span><b>Design preview</b> · Fictional training data. No connection to Homebox, no real changes or prints.</span><span>Desktop management concept</span></div>
<div class="app"><aside class="rail"><h2 class="brand">Workshop</h2><p class="group">Equipment management</p><nav id="nav"></nav><div class="native"><button onclick="nativeLink()">Open Homebox inventory</button><p class="role-note">Same Homebox records. Workshop tools add loans, badges, layout, and recovery.</p></div></aside><div class="workspace"><header class="top"><strong>Workshop collection</strong><div class="identity"><label for="role">Preview role</label><select id="role" onchange="setRole(this.value)"><option value="manager">Workshop manager</option><option value="member">Member</option></select><span id="signed-name">Andreas</span></div><select id="mobile-nav" aria-label="Navigate workspace" onchange="go(this.value)"></select></header><main id="view"></main></div></div>
<dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="dialog-close" onclick="closeDialog()">Close</button></div><div class="dialog-body" id="dialog-body"></div></dialog><div class="toast" role="status" id="toast" hidden></div>
<script>
const pages=[['overview','Overview',false],['equipment','Equipment',false],['loans','Loans & notes',false],['people','People & badges',true],['workshop','Workshop & storage',false],['imports','Imports',true],['labels','Labels',true],['recovery','Recovery',true],['system','System',true]];
const equipment=[{id:'EQ-104',name:'Cordless drill kit',shelf:'XYZ / 2 / B',condition:'Ready',custody:'With Andreas',loan:true},{id:'EQ-105',name:'Soldering station',shelf:'CAB / 1',condition:'Ready',custody:'Available',loan:false},{id:'EQ-106',name:'Bench multimeter',shelf:'XYZ / 3 / A',condition:'Broken',custody:'Available',loan:false}];
let previewRow={name:'Training saw',shelf:'',saved:false};
let current='overview',role='manager',selectedItem=equipment[0],itemTab='summary',importStep=0,selection=new Set(),labelSelection=new Set();const view=document.querySelector('#view'),dialog=document.querySelector('#dialog');
function manager(){return role==='manager'}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function title(name,description,action=''){return `<div class="title"><div><h1>${name}</h1><p>${description}</p></div>${action}</div>`}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,7000)}
function openDialog(name,body){document.querySelector('#dialog-title').textContent=name;document.querySelector('#dialog-body').innerHTML=body;dialog.showModal()}
function closeDialog(){dialog.close()}
function nativeLink(id=''){toast('Preview: opens the original Homebox '+(id?'record for '+id:'inventory')+' using the current Pi address. No second inventory is created.')}
function setRole(value){closeDialog();role=value;document.querySelector('#signed-name').textContent=manager()?'Andreas':'Training member';if(pages.find(p=>p[0]===current)?.[2]&&!manager())current='overview';selection.clear();go(current)}
function go(page){if(pages.find(p=>p[0]===page)?.[2]&&!manager()){toast('This area requires Workshop manager permission.');return}current=page;document.querySelector('#nav').innerHTML=pages.filter(p=>manager()||!p[2]).map(p=>`<button class="${current===p[0]?'selected':''}" aria-current="${current===p[0]?'page':'false'}" onclick="go('${p[0]}')">${p[1]}</button>`).join('');document.querySelector('#mobile-nav').innerHTML=pages.filter(p=>manager()||!p[2]).map(p=>`<option value="${p[0]}" ${p[0]===page?'selected':''}>${p[1]}</option>`).join('');({overview:overview,equipment:equipmentPage,loans:loans,people:people,workshop:workshop,imports:imports,labels:labels,recovery:recovery,system:system})[page]();}
function overview(){view.innerHTML=title('Workshop overview','Start with the work that needs your attention.')+`<div class="attention"><p><b>One saved operation needs review.</b> Check its physical result before repeating a return or print. ${manager()?'<button onclick="go(\'recovery\')">Review operation</button>':'Ask a workshop manager for help.'}</p></div><div class="two"><section class="panel"><h2>Equipment in use</h2><ul class="list"><li><span><b>Cordless drill kit</b><span class="sub">Andreas · home shelf XYZ / 2 / B</span></span><button onclick="showItem('EQ-104','loans')">View loan</button></li></ul><p class="footnote">Checkout keeps the assigned shelf and tracks the borrower separately.</p></section><section class="panel"><h2>Before the next checkout</h2><ul class="list"><li><span><b>Bench multimeter</b><span class="sub">Broken · damaged lead</span></span><button onclick="showItem('EQ-106')">Inspect record</button></li><li><span><b>Review return notes</b><span class="sub">Cleaning and condition comments</span></span><button onclick="go('loans')">Open notes</button></li></ul></section></div>`}
function rows(items){return items.map(e=>`<tr><td><input type="checkbox" aria-label="Select ${e.name}" ${selection.has(e.id)?'checked':''} onchange="pick('${e.id}',this.checked)"></td><td class="name"><button onclick="showItem('${e.id}')">${e.name}</button><span class="sub">${e.id}</span></td><td>${e.shelf}</td><td><span class="tag ${e.condition==='Ready'?'ready':'warn'}">${e.condition}</span></td><td><span class="tag ${e.loan?'loan':''}">${e.custody}</span></td></tr>`).join('')}
function equipmentPage(){view.innerHTML=title('Equipment','Homebox records with borrowing and return context.',`<button onclick="nativeLink()">Manage inventory in Homebox</button>`)+`<div class="tools"><input aria-label="Search equipment" placeholder="Search name, code, shelf…" oninput="filterEquipment(this.value)"><div class="toolbar"><span id="selection-count" class="count">${selection.size} selected</span>${manager()?'<button onclick="selectedLabels()">Queue labels</button>':''}<button onclick="selection.clear();equipmentPage()">Clear selection</button></div></div><div class="table-wrap"><table><thead><tr><th>Select</th><th>Equipment</th><th>Assigned storage</th><th>Condition</th><th>Borrowing</th></tr></thead><tbody id="equipment-rows">${rows(equipment)}</tbody></table></div><p class="footnote">Select records to queue labels. Changes to native equipment use Homebox’s supported controls. Each label is previewed before printing.</p>`}
function filterEquipment(value){const items=equipment.filter(e=>JSON.stringify(e).toLowerCase().includes(value.toLowerCase()));document.querySelector('#equipment-rows').innerHTML=items.length?rows(items):'<tr><td colspan="5" class="empty">No equipment matches. Clear your search to see all items.</td></tr>'}
function pick(id,checked){checked?selection.add(id):selection.delete(id);document.querySelector('#selection-count').textContent=selection.size+' selected'}
function selectedLabels(){if(!selection.size){toast('Select equipment first.');return}labelSelection=new Set(selection);go('labels')}
function showItem(id,tab='summary'){selectedItem=equipment.find(e=>e.id===id);itemTab=tab;openDialog(selectedItem.name,itemContent())}
function switchItemTab(tab){itemTab=tab;document.querySelector('#dialog-body').innerHTML=itemContent()}
function itemContent(){const e=selectedItem;const tabs=[['summary','Summary'],['loans','Loan'],['notes','Return notes'],['maintenance','Maintenance']];let body='';if(itemTab==='summary')body=`<p><b>Equipment code:</b> ${e.id}</p><p><b>Assigned storage:</b> ${e.shelf}</p><p><b>Condition:</b> ${e.condition}</p><p><b>Borrowing:</b> ${e.custody}</p><button onclick="nativeLink('${e.id}')">Edit native Homebox record</button>`;if(itemTab==='loans')body=`<p>${e.loan?'Checked out by Andreas.':'No current loan.'}</p><p>The assigned shelf remains ${e.shelf}.</p>${e.loan&&manager()?'<button onclick="closeDialog();returnReview()">Record a return</button>':''}<p class="footnote">Administrative returns are attributed to the signed-in operator; they do not pretend a borrower scanned a badge.</p>`;if(itemTab==='notes')body=`<div class="timeline"><article><b>Returned clean</b><p>Was dirty, but returned clean.</p><span class="sub">Andreas · Oct 4, 2026, 18:43 EDT · Completed return</span></article><article><b>Inspection comment</b><p>Checked the case and all kit components.</p><span class="sub">Training user · Oct 3, 2026, 14:20 EDT</span></article></div><p class="footnote">Recorded author and time are preserved. Only completed returns publish their notes. Corrections add a new entry rather than silently rewriting history.</p>`;if(itemTab==='maintenance')body=`<p>Native Homebox stores issue reports, attachments, and maintenance.</p><button onclick="nativeLink('${e.id}')">Open native maintenance</button><p class="footnote">Mark equipment Ready only after an actual inspection. A note or a return does not complete a repair.</p>`;return `<div class="tabs">${tabs.map(t=>`<button class="${itemTab===t[0]?'active':''}" onclick="switchItemTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${body}`}
function loans(){view.innerHTML=title('Loans & return notes','See who has equipment, and what happened when it came back.')+`<div class="table-wrap"><table><thead><tr><th>Equipment</th><th>Borrower</th><th>Home shelf</th><th>Action</th></tr></thead><tbody><tr><td>Cordless drill kit</td><td>Andreas</td><td>XYZ / 2 / B</td><td><button onclick="showItem('EQ-104','notes')">Read notes</button> ${manager()?'<button onclick="returnReview()">Record return</button>':''}</td></tr></tbody></table></div><p class="footnote">Desktop management and badge-driven kiosk transactions have distinct operator attribution. Member access should be scoped to their permitted records.</p>`}
function returnReview(){openDialog('Review administrative return',`<p><b>Cordless drill kit</b> is currently with Andreas.</p><p>Return to <b>XYZ / 2 / B</b> · keep condition Ready.</p><div class="form"><label for="return-note">Return note (optional)</label><textarea id="return-note" maxlength="1000" placeholder="Cleaning, missing parts, or anything useful…"></textarea><p class="hint">Logged as signed-in operator Andreas, using the actual completion time.</p></div><div class="right"><button onclick="closeDialog()">Cancel</button><button class="main" onclick="closeDialog();toast('Preview only: review accepted. A real return would use the existing durable ledger and end the transaction.')">Confirm return</button></div>`)}
function people(){view.innerHTML=title('People & badges','Homebox identity, workshop permissions, and badge status in one place.',`<button class="main" onclick="newPerson()">Add person</button>`)+`<div class="table-wrap"><table><thead><tr><th>Person</th><th>Homebox membership</th><th>Workshop role</th><th>Badge</th><th>Actions</th></tr></thead><tbody><tr><td>Andreas<span class="sub">Training account</span></td><td>Workshop</td><td>Manager</td><td><span class="tag ready">Active</span></td><td><button onclick="badge('Andreas')">Manage badge</button></td></tr><tr><td>Training member</td><td>Workshop</td><td>Member</td><td>No badge</td><td><button onclick="badge('Training member')">Issue badge</button></td></tr></tbody></table></div><p class="footnote">Names are not permissions. Workshop managers are explicitly authorized by native user ID and collection. Homebox-wide superuser is a separate privilege.</p>`}
function newPerson(){openDialog('Add a person to Workshop',`<div class="form"><label for="person-name">Name</label><input id="person-name" placeholder="Person’s name"><label for="person-email">Homebox email</label><input type="email" id="person-email" placeholder="person@example.com"><label for="person-role">Workshop role</label><select id="person-role"><option>Member</option><option>Workshop manager</option></select><p class="hint">Prefer a Homebox invitation so the person chooses their own password. Badge issuance follows verified membership.</p></div><div class="right"><button onclick="closeDialog()">Cancel</button><button class="main" onclick="reviewPerson()">Review invitation</button></div>`)}
function reviewPerson(){const name=document.querySelector('#person-name').value.trim(),email=document.querySelector('#person-email').value.trim(),memberRole=document.querySelector('#person-role').value;if(!name||!email.includes('@')){toast('Enter a name and valid email before reviewing.');return}document.querySelector('#dialog-title').textContent='Review person';document.querySelector('#dialog-body').innerHTML=`<p><b>${escapeText(name)}</b><br>${escapeText(email)}</p><p>Collection: Workshop · Role: ${escapeText(memberRole)}</p><div class="right"><button onclick="closeDialog()">Cancel</button><button class="main" onclick="closeDialog();toast('Preview only: no account, invitation, email, or badge was created.')">Confirm invitation</button></div>`}
function badge(name){openDialog('Badge for '+name,`<p>Manage ${escapeText(name)}’s badge for this workshop.</p><p>New badge: review the owner, issue it, then preview its label. Lost badge: revoke it before issuing a replacement.</p><div class="attention">A badge is a personal access token. Show a new QR only during issuance; never expose it in the People list or logs.</div><div class="right"><button onclick="closeDialog()">Cancel</button><button onclick="closeDialog();toast('Preview only: badge would be revoked. Existing sessions would be checked and ended.')">Revoke lost badge</button><button class="main" onclick="closeDialog();toast('Preview only: badge owner confirmed. No real token or print was generated.')">Review new badge</button></div>`)}
function workshop(){view.innerHTML=title('Workshop & storage','Select a rack to inspect its native shelves, bins, and equipment.',manager()?`<button onclick="toast('Preview: edit geometry, then save with revision checking. Native storage is linked separately.')">Edit layout</button>`:'')+`<div class="split"><div class="panel"><svg class="map" viewBox="0 0 620 360" role="img" aria-label="Training workshop floor plan"><rect x="18" y="18" width="584" height="324" fill="white" stroke="#263f52" stroke-width="7"/><rect x="45" y="45" width="155" height="62" rx="3" fill="#dbeaf1" stroke="#6995ab" role="button" tabindex="0" aria-label="Select rack XYZ" onclick="rack()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();rack()}"></rect><text x="90" y="80" fill="#263f52">Rack XYZ</text><rect x="230" y="45" width="150" height="62" fill="#edf3f7" stroke="#8fa8b8"/><text x="265" y="80">Workbench</text><rect x="520" y="45" width="50" height="130" fill="#edf3f7" stroke="#8fa8b8"/><text x="525" y="200">Cabinet</text><path d="M22 200 H270 M270 200 L270 285" stroke="#9b7d42" stroke-width="7" fill="none"/><text x="100" y="225" fill="#8b6a2a">Fence</text><path d="M525 340 H600 M600 260 V340" stroke="#17624a" stroke-width="4" fill="none"/><text x="490" y="290">Gate</text></svg><p class="footnote">Drawing objects link to native storage. Moving a symbol does not move inventory.</p></div><section class="panel" id="rack"><h2>Rack XYZ</h2><p>Select the rack in the drawing.</p><button onclick="rack()">Open shelves & bins</button></section></div>`}
function rack(){document.querySelector('#rack').innerHTML=`<h2>Rack XYZ</h2><p>Linked to native location XYZ.</p><ul class="list"><li><span><b>Shelf 3</b><span class="sub">Bin A · Bench multimeter</span></span><button onclick="showItem('EQ-106')">Open</button></li><li><span><b>Shelf 2</b><span class="sub">Bin B · Cordless drill kit</span></span><button onclick="showItem('EQ-104')">Open</button></li></ul><button onclick="nativeLink('Rack XYZ')">Manage native storage</button><p class="footnote">One-room layout today. Multiple rooms should extend the model later.</p>`}
function imports(){const names=['Choose CSV','Map columns','Review & save','Create & labels'];view.innerHTML=title('Import equipment','Saved batches, row review, and label progress.')+`<div class="steps">${names.map((n,i)=>`<span class="${importStep===i?'current':''}">${i+1}. ${n}</span>`).join('')}</div><div class="panel" id="import-panel"></div>`;const panel=document.querySelector('#import-panel');if(importStep===0)panel.innerHTML=`<h2>Start or resume</h2><p>Export a CSV UTF-8 file from your previous system. Map stable source IDs to recognize repeat imports.</p><div class="form"><label for="source">Source system</label><input id="source" value="Asset Manager"><p class="hint">Preview uses training-assets.csv, with two fictional rows.</p></div><div class="right"><button onclick="importStep=2;imports()">Resume training batch</button><button class="main" onclick="importStep=1;imports()">Use training CSV</button></div>`;if(importStep===1)panel.innerHTML=`<h2>Map source columns</h2><div class="form"><label for="col-name">Equipment name</label><select id="col-name"><option>Asset name</option></select><label for="col-id">Original source ID</label><select id="col-id"><option>Asset ID</option></select><label for="col-location">Assigned location</label><select id="col-location"><option>Location</option></select></div><p>Unknown locations and categories must be selected during review.</p><div class="right"><button onclick="importStep=0;imports()">Back</button><button class="main" onclick="importStep=2;imports()">Review rows</button></div>`;if(importStep===2)panel.innerHTML=`<h2>Review items</h2><div class="table-wrap"><table><thead><tr><th>Source ID</th><th>Equipment</th><th>Location</th><th>Condition</th><th>Review</th></tr></thead><tbody><tr><td>AM-18</td><td>Training clamp</td><td>XYZ / 2 / B</td><td>Unreviewed</td><td><span class="tag ready">Saved</span></td></tr><tr><td>AM-19</td><td>Training saw</td><td>Choose location</td><td>Unreviewed</td><td><button onclick="reviewRow()">Fix row</button></td></tr></tbody></table></div><p>Ready requires physical inspection. Only saved, valid, selected rows can be created.</p><div class="right"><button onclick="importStep=1;imports()">Back to mapping</button><button class="main" onclick="importStep=3;imports()">Batch summary</button></div>`;if(importStep===3)panel.innerHTML=`<h2>Review creation</h2><p><b>1 saved valid item</b> · 1 needs review. Existing inventory will not be overwritten.</p><div class="attention">An uncertain creation is recovered using its saved job, never by uploading another batch.</div><div class="right"><button onclick="importStep=2;imports()">Back to review</button><button class="main" onclick="toast('Preview only: no records were created. The label queue follows verified creation.')">Confirm: create 1 reviewed item</button></div>`;
if(importStep===2&&previewRow.saved){const cells=panel.querySelectorAll('tbody tr')[1].cells;cells[1].textContent=previewRow.name;cells[2].textContent=previewRow.shelf;cells[4].querySelector('button').textContent='Edit row'}
if(importStep===3&&previewRow.saved){panel.querySelector('p').innerHTML='<b>2 saved valid items</b> · 0 need review. Existing inventory will not be overwritten.';panel.querySelector('.main').textContent='Confirm: create 2 reviewed items'}
}
function reviewRow(){openDialog('Edit imported row',`<div class="form"><label for="row-name">Equipment name</label><input id="row-name" value="${escapeText(previewRow.name)}"><label for="row-shelf">Assigned storage</label><select id="row-shelf"><option ${previewRow.shelf==='XYZ / 2 / B'?'selected':''}>XYZ / 2 / B</option><option ${previewRow.shelf==='CAB / 1'?'selected':''}>CAB / 1</option></select><p class="hint">Changes remain a draft until saved.</p></div><div class="right"><button onclick="closeDialog()">Cancel</button><button class="main" onclick="savePreviewRow()">Save review</button></div>`)}
function savePreviewRow(){const name=document.querySelector('#row-name').value.trim(),shelf=document.querySelector('#row-shelf').value;if(!name){toast('Enter an equipment name before saving.');return}previewRow={name,shelf,saved:true};closeDialog();imports();toast('Training row saved in this preview. Real creation still requires batch confirmation.')}
function labels(){const items=labelSelection.size?equipment.filter(e=>labelSelection.has(e.id)):[equipment[0]];view.innerHTML=title('Label queue','Select, preview, and confirm physical output on the Pi printer.')+`<div class="attention"><b>Destination: workshop Pi SUPVAN printer.</b> Laptop actions print there, not to the laptop’s default printer.</div><section class="panel"><h2>${items.length} equipment label${items.length===1?'':'s'} selected</h2><ul class="list">${items.map(e=>`<li><span><b>${e.name}</b><span class="sub">${e.id} · not yet printed</span></span><button onclick="labelPreview('${e.id}')">Preview label</button></li>`).join('')}</ul><div class="right"><button onclick="go('equipment')">Back to equipment</button><button class="main" onclick="printReview(${items.length})">Review print job</button></div></section>`}
function labelPreview(id){const e=equipment.find(e=>e.id===id);openDialog('Label preview',`<p>${e.name}</p><div class="label-preview"><b>Equipment</b><div class="qr" aria-label="Illustrative pattern, not a scannable QR"></div><strong>${e.id}</strong><small>Training label · illustrative only</small></div><p class="footnote">Actual labels are rendered by the existing printer adapter and previewed at the loaded stock size.</p>`)}
function printReview(count){openDialog('Confirm workshop print',`<p><b>${count} label${count===1?'':'s'}</b> will print on the <b>Pi SUPVAN</b>.</p><p>Check stock and printer readiness before confirming.</p><div class="right"><button onclick="closeDialog()">Cancel</button><button class="main" onclick="closeDialog();toast('Preview only: no physical print. An uncertain print would stop the queue and require inspection.')">Confirm print</button></div>`)}
function recovery(){view.innerHTML=title('Recovery','Inspect the physical result before resolving a saved operation.')+`<div class="table-wrap"><table><thead><tr><th>Operation</th><th>Equipment</th><th>Result</th><th>Next action</th></tr></thead><tbody><tr><td>Return</td><td>Cordless drill kit</td><td><span class="tag warn">Needs verification</span></td><td><button class="main" onclick="recoverDetail()">Inspect saved operation</button></td></tr></tbody></table></div><p class="footnote">Do not clear an uncertain operation by changing its request key. Completion and safe cancellation are explicit audited decisions.</p>`}
function recoverDetail(){openDialog('Inspect saved return',`<p>Equipment: <b>Cordless drill kit</b><br>Assigned shelf: XYZ / 2 / B<br>Saved note: Was dirty, but returned clean.</p><div class="attention">Verify the equipment is physically returned and native fields match the saved plan.</div><label><input type="checkbox" id="verified" onchange="document.querySelector('#resolve').disabled=!this.checked"> I inspected the physical result and stored values.</label><div class="right"><button onclick="closeDialog()">Back to recovery</button><button id="resolve" class="main" disabled onclick="closeDialog();toast('Preview: recovery decision reviewed. A real result would be saved once with operator attribution.')">Review completion</button></div>`)}
function system(){view.innerHTML=title('System','Pi hardware, service readiness, and protected recovery backups.')+`<section class="panel"><ul class="list"><li><span><b>Homebox</b><span class="sub">Inventory service</span></span><span class="tag ready">Ready · training status</span></li><li><span><b>Companion</b><span class="sub">Loans, badges, layout, recovery</span></span><span class="tag ready">Ready · training status</span></li><li><span><b>Workshop printer</b><span class="sub">Pi SUPVAN · inspect physical stock</span></span><span class="tag">Training status</span></li></ul><div class="right"><button onclick="toast('Preview only: a real refresh reads current Pi service and device status.')">Refresh status</button><button onclick="backupReview()">Review recovery backup</button></div></section><p class="footnote">Backups stay private. Use a maintainer-controlled restore flow; never replace a live database with an older copy.</p>`}
function backupReview(){openDialog('Review recovery backup',`<p>A consistent backup briefly pauses the kiosk and restarts it afterward.</p><p>The archive stays private on the Pi and may contain credentials.</p><div class="right"><button onclick="closeDialog()">Cancel</button><button class="main" onclick="closeDialog();toast('Preview only: no backup was started.')">Confirm backup</button></div>`)}
go('overview');
</script></body></html>
