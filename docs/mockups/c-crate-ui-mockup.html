<style>
*{box-sizing:border-box}body{margin:0;background:hsl(var(--background-accent));color:hsl(var(--foreground));font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:68px;background:hsl(var(--card));border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;gap:22px;padding:0 clamp(16px,4vw,54px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.025em;font-size:21px;white-space:nowrap}.brand-mark{width:32px;height:32px;background:hsl(var(--primary));border-radius:var(--radius);display:grid;place-items:center;color:hsl(var(--primary-foreground));font-size:19px}.nav{display:flex;gap:4px;flex:1}.nav button{border:0;background:transparent;color:hsl(var(--muted-foreground));padding:10px 13px;border-radius:var(--radius);font-weight:650}.nav button:hover,.nav button.active{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}.demo-label{border:1px solid hsl(var(--border));background:hsl(var(--muted));border-radius:var(--radius);padding:6px 11px;color:hsl(var(--muted-foreground));font-size:12px;font-weight:700;white-space:nowrap}.theme-picker{display:flex;align-items:center;gap:7px;font-size:12px;color:hsl(var(--muted-foreground));font-weight:650;white-space:nowrap}.theme-picker select{width:auto;min-width:112px;padding:6px 27px 6px 9px;font-size:13px}.content{max-width:1320px;margin:0 auto;padding:34px clamp(16px,4vw,52px) 60px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:23px}.heading h1{font-size:clamp(27px,3.2vw,38px);line-height:1.1;letter-spacing:-.03em;margin:0 0 5px;font-weight:750}.heading p{color:hsl(var(--muted-foreground));margin:0}.button{border:1px solid hsl(var(--border));color:hsl(var(--foreground));background:hsl(var(--card));border-radius:var(--radius);padding:11px 15px;font-weight:650;transition:background .16s,transform .16s}.button:hover{background:hsl(var(--accent))}.button:active{transform:scale(.985)}.button.primary{background:hsl(var(--primary));border-color:hsl(var(--primary));color:hsl(var(--primary-foreground))}.button.primary:hover{filter:brightness(.96)}.button.soft{background:hsl(var(--accent));border-color:transparent;color:hsl(var(--accent-foreground))}.button.danger{color:hsl(var(--destructive))}.button.large{min-height:58px;padding:15px 20px;font-size:18px}.button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}.toolbar{display:flex;align-items:center;gap:10px}.searchbox{position:relative;flex:1}.searchbox:before{content:"⌕";position:absolute;left:14px;top:9px;font-size:24px;color:hsl(var(--muted-foreground))}.input, input,textarea,select{border:1px solid hsl(var(--input));border-radius:var(--radius);background:hsl(var(--background));color:hsl(var(--foreground));padding:12px 13px;width:100%}.searchbox input{padding-left:43px;min-height:50px}.split{display:grid;grid-template-columns:minmax(300px,.88fr) minmax(420px,1.35fr);gap:18px;align-items:start}.panel{background:hsl(var(--card));color:hsl(var(--card-foreground));border:1px solid hsl(var(--border));border-radius:var(--radius);overflow:hidden}.list-panel{min-height:600px}.list-top{padding:17px;border-bottom:1px solid hsl(var(--border));display:grid;gap:12px}.list-count{font-size:13px;color:hsl(var(--muted-foreground))}.item-list{padding:7px}.result{display:flex;width:100%;align-items:center;gap:13px;text-align:left;padding:12px;border:0;border-radius:var(--radius);background:transparent;color:inherit}.result:hover,.result.selected{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}.thumb{height:56px;width:64px;border-radius:var(--radius);flex:none;display:grid;place-items:center;background:hsl(var(--muted));color:hsl(var(--muted-foreground));font-size:12px;font-weight:700;letter-spacing:.04em}.result-copy{display:block;min-width:0;flex:1}.result-name,.result-sub{display:block}.result-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-sub{color:hsl(var(--muted-foreground));font-size:13px;margin-top:3px}.status{font-size:11px;font-weight:700;border-radius:var(--radius);padding:5px 8px;white-space:nowrap;background:hsl(var(--accent));color:hsl(var(--accent-foreground))}.status.out{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}.detail{padding:25px clamp(19px,3vw,34px);min-height:600px}.detail-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{display:none}.hero{display:grid;grid-template-columns:145px 1fr;gap:24px;align-items:center;padding-bottom:22px;border-bottom:1px solid hsl(var(--border))}.hero-art{height:132px;border-radius:var(--radius);background:hsl(var(--muted));color:hsl(var(--muted-foreground));display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:.04em}.hero h2{font-size:30px;line-height:1.13;letter-spacing:-.025em;margin:10px 0 6px}.hero p{color:hsl(var(--muted-foreground));margin:0}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px 0;border-bottom:1px solid hsl(var(--border))}.fact-label{color:hsl(var(--muted-foreground));font-size:12px;margin-bottom:5px}.fact-value{font-weight:650}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 11px}.section-title h3{margin:0;font-size:18px;letter-spacing:-.01em}.note{padding:13px 0;border-bottom:1px solid hsl(var(--border))}.note:last-child{border:0}.note-meta{display:flex;gap:8px;align-items:center;color:hsl(var(--muted-foreground));font-size:12px;margin-bottom:5px}.avatar{height:22px;width:22px;border-radius:50%;background:hsl(var(--accent));color:hsl(var(--accent-foreground));display:inline-grid;place-items:center;font-weight:700}.empty{padding:38px 20px;text-align:center;color:hsl(var(--muted-foreground))}.empty strong{display:block;color:hsl(var(--foreground));font-size:18px;margin-bottom:6px}.form-panel{max-width:900px;margin:auto;padding:clamp(20px,4vw,38px)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:grid;gap:7px}.field label{font-size:14px;font-weight:700}.field small{color:hsl(var(--muted-foreground))}.span2{grid-column:1/-1}.photo-zone{display:flex;gap:17px;align-items:center;border:1px dashed hsl(var(--border));border-radius:var(--radius);padding:14px;background:hsl(var(--background-accent))}.photo-preview{width:92px;height:82px;border-radius:var(--radius);background:hsl(var(--muted));color:hsl(var(--muted-foreground));display:grid;place-items:center;font-size:12px;font-weight:700;overflow:hidden;flex:none}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-zone input{max-width:260px;padding:8px}.details-toggle{margin:21px 0 0;border-top:1px solid hsl(var(--border));padding-top:18px}.details-toggle summary{font-weight:700;cursor:pointer}.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:25px}.success{max-width:650px;margin:70px auto;text-align:center;padding:45px 25px}.success-mark{width:58px;height:58px;border-radius:var(--radius);display:grid;place-items:center;background:hsl(var(--accent));color:hsl(var(--accent-foreground));font-size:29px;margin:0 auto 18px}.success h2{font-size:30px;margin:0 0 8px}.success p{color:hsl(var(--muted-foreground));margin:0}.success .actions{justify-content:center;margin-top:24px}.flow{max-width:850px;margin:0 auto}.flow-progress{display:flex;align-items:center;gap:10px;color:hsl(var(--muted-foreground));font-weight:650;margin:0 0 20px}.flow-progress .current{color:hsl(var(--primary))}.flow-card{padding:clamp(22px,4vw,42px)}.flow-card h2{font-size:27px;letter-spacing:-.025em;margin:0 0 7px}.flow-card>p{margin:0 0 25px;color:hsl(var(--muted-foreground))}.scanbox{display:flex;gap:12px;align-items:center}.scanbox input{min-height:60px;font-size:20px}.scan-symbol{font-size:30px;color:hsl(var(--primary))}.hint{color:hsl(var(--muted-foreground));font-size:13px;margin-top:10px}.review-item{display:flex;align-items:center;gap:16px;padding:16px;background:hsl(var(--muted));border-radius:var(--radius);margin:20px 0}.review-item .thumb{height:72px;width:84px;font-size:12px}.review-item strong{font-size:19px}.review-item p{margin:3px 0 0;color:hsl(var(--muted-foreground))}.warning{background:hsl(var(--muted));border-left:4px solid hsl(var(--ring));padding:13px 15px;border-radius:var(--radius);margin:18px 0}.flow-footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.notice{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:hsl(var(--foreground));color:hsl(var(--background));border-radius:var(--radius);padding:12px 17px;transition:.2s;z-index:10;pointer-events:none}.notice.show{opacity:1;transform:translate(-50%,0)}.mobile-only{display:none}.hidden{display:none!important}.location-contents{display:grid;gap:7px}.location-row{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:var(--radius);background:hsl(var(--muted))}.location-row span:last-child{color:hsl(var(--muted-foreground));font-size:13px}.toggle-wrap{display:flex;gap:6px;background:hsl(var(--muted));border-radius:var(--radius);padding:4px}.toggle-wrap button{border:0;background:transparent;padding:7px 10px;border-radius:var(--radius);font-size:13px;font-weight:700;color:hsl(var(--muted-foreground))}.toggle-wrap button.on{background:hsl(var(--card));color:hsl(var(--foreground))}.mode-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
@media(max-width:850px){.theme-picker{font-size:11px}.theme-picker select{min-width:92px}.topbar{gap:11px;padding-inline:14px}.brand{font-size:18px}.nav{overflow-x:auto}.nav button{padding:9px;font-size:13px;white-space:nowrap}.demo-label{display:none}.theme-picker{margin-left:auto}.split{grid-template-columns:1fr}.detail{min-height:0}.split.mobile-detail .list-panel{display:none}.split.mobile-detail .detail{display:block}.split:not(.mobile-detail) .detail{display:none}.mobile-only{display:inline-flex}.detail .back{display:inline-flex}}
@media(max-width:560px){.topbar{height:auto;min-height:61px;flex-wrap:wrap;padding-top:9px;padding-bottom:7px}.brand{width:100%}.nav{width:100%;order:2}.nav button{flex:1}.content{padding-top:23px}.heading{align-items:flex-start}.heading h1{font-size:29px}.heading p{font-size:14px}.heading .button{padding:10px}.toolbar{flex-wrap:wrap}.searchbox{flex-basis:100%}.hero{grid-template-columns:86px 1fr;gap:15px}.hero-art{height:90px;font-size:48px}.hero h2{font-size:24px}.facts{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.actions{flex-direction:column-reverse;align-items:stretch}.actions button{width:100%}.photo-zone{align-items:flex-start;flex-direction:column}.flow-footer{flex-direction:column-reverse}.flow-footer button{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>

<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><span class="brand-mark">C</span> C-Crate</div>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-page="inventory">Inventory</button><button data-page="locations">Locations</button><button data-page="checkout">Check out</button><button data-page="return">Return</button><button data-page="create">Create item</button>
  </nav><label class="theme-picker" title="Preview only; this does not change the saved Homebox theme">Preview theme <select id="theme-picker" aria-label="Preview theme"></select></label><span class="demo-label">Demo only</span>
</header>
<main class="content" id="main"></main>
</div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<script>
const initialItems=[
 {id:'IT-1048',name:'Makita 18V impact driver',category:'Power tools',location:'Tool wall · Bay 2',status:'Available',barcode:'49029-18',notes:[{text:'Battery pair checked and charged.',author:'Morgan',time:'Oct 20, 2026 · 3:42 PM'},{text:'Chuck cleaned after the cabinet build.',author:'Lee',time:'Oct 17, 2026 · 11:08 AM'}]},
 {id:'IT-1033',name:'Bosch laser measure',category:'Measuring',location:'Survey kit · Shelf A',status:'Checked out',barcode:'49029-33',notes:[{text:'Returned with case and wrist strap.',author:'Sam',time:'Oct 16, 2026 · 4:20 PM'}]},
 {id:'IT-0982',name:'DeWalt circular saw',category:'Power tools',location:'Tool wall · Bay 1',status:'Available',barcode:'49029-82',notes:[]},
 {id:'IT-0874',name:'Folding work light',category:'Lighting',location:'Electrical · Rack 3',status:'Available',barcode:'49028-74',notes:[{text:'New diffuser fitted.',author:'Morgan',time:'Oct 8, 2026 · 9:15 AM'}]},
 {id:'IT-0761',name:'Clamping square set',category:'Hand tools',location:'Wood shop · Drawer 4',status:'Available',barcode:'49027-61',notes:[]}
];
let items=structuredClone(initialItems),selectedId=items[0].id,page='inventory',query='',selectedLocation='Tool wall',flow={step:0,badge:'',item:null},savedItem=null;
const themeOptions=[['C-Crate','homebox'],['Garden','garden'],['Light','light'],['Dark','dark'],['Cupcake','cupcake'],['Bumblebee','bumblebee'],['Emerald','emerald'],['Corporate','corporate'],['Synthwave','synthwave'],['Retro','retro'],['Cyberpunk','cyberpunk'],['Valentine','valentine'],['Halloween','halloween'],['Forest','forest'],['Aqua','aqua'],['Lofi','lofi'],['Pastel','pastel'],['Fantasy','fantasy'],['Wireframe','wireframe'],['Black','black'],['Luxury','luxury'],['Dracula','dracula'],['Cmyk','cmyk'],['Autumn','autumn'],['Business','business'],['Acid','acid'],['Lemonade','lemonade'],['Night','night'],['Coffee','coffee'],['Winter','winter']];
const darkThemes=['dark','synthwave','retro','cyberpunk','valentine','halloween','forest','aqua','black','luxury','dracula','business','night','coffee'];
function applyPreviewTheme(value){const resolved=value==='homebox'&&matchMedia('(prefers-color-scheme: dark)').matches?'night':value;document.documentElement.className=Array.from(document.documentElement.classList).filter(c=>!c.startsWith('theme-')).concat('theme-'+resolved).join(' ');document.documentElement.dataset.theme=resolved;document.documentElement.style.colorScheme=darkThemes.includes(resolved)?'dark':'light';try{localStorage.setItem('ccrate-mockup-theme',value)}catch{}const picker=document.querySelector('#theme-picker');if(picker)picker.value=value}
function initThemePicker(){const picker=document.querySelector('#theme-picker');picker.innerHTML=themeOptions.map(([label,value])=>`<option value="${value}">${label}</option>`).join('');picker.addEventListener('change',()=>applyPreviewTheme(picker.value));let saved='homebox';try{saved=localStorage.getItem('ccrate-mockup-theme')||'homebox'}catch{}applyPreviewTheme(themeOptions.some(([,value])=>value===saved)?saved:'homebox')}

const locations=[{name:'Tool wall',detail:'Main workshop',count:18,items:['Makita 18V impact driver','DeWalt circular saw']},{name:'Survey kit',detail:'Storage room · Shelf A',count:7,items:['Bosch laser measure','Tripod stand']},{name:'Electrical',detail:'Main workshop · Rack 3',count:12,items:['Folding work light','Cable reel · 20 m']},{name:'Wood shop',detail:'Wood shop · Drawer 4',count:24,items:['Clamping square set','Bench dogs · set of 4']}];
const main=document.querySelector('#main');
function setPage(next){page=next;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===next));if(next==='checkout'||next==='return')flow={step:0,badge:'',item:null};render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function noteDate(){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date())}
function itemMarker(name){return escapeHtml(name.trim().split(/\s+/).slice(0,2).map(word=>word[0]).join('').toUpperCase())}
function locationMarker(name){return escapeHtml(name.split(/\s+/).map(word=>word[0]).join('').toUpperCase())}
function itemMatches(item){return `${item.name} ${item.category} ${item.location} ${item.id} ${item.barcode}`.toLowerCase().includes(query.toLowerCase())}
function render(){if(page==='inventory')renderInventory();else if(page==='locations')renderLocations();else if(page==='create')renderCreate();else renderFlow()}
function renderInventory(){const filtered=items.filter(itemMatches),chosen=items.find(x=>x.id===selectedId)||filtered[0];if(chosen)selectedId=chosen.id;main.innerHTML=`<div class="heading"><div><h1>Inventory</h1><p>Find an item and see what matters at a glance.</p></div><button class="button primary" onclick="setPage('create')">＋ Create item</button></div><div class="split" id="split"><section class="panel list-panel"><div class="list-top"><div class="toolbar"><div class="searchbox"><input id="search" type="search" placeholder="Search items, locations, or barcode" value="${escapeHtml(query)}" aria-label="Search inventory"></div></div><div class="list-count">${filtered.length} items</div></div><div class="item-list">${filtered.length?filtered.map(item=>`<button class="result ${chosen&&chosen.id===item.id?'selected':''}" onclick="selectItem('${item.id}')"><span class="thumb" >${itemMarker(item.name)}</span><span class="result-copy"><span class="result-name">${escapeHtml(item.name)}</span><span class="result-sub">${escapeHtml(item.location)} · ${item.id}</span></span><span class="status ${item.status==='Checked out'?'out':''}">${item.status}</span></button>`).join(''):`<div class="empty"><strong>No matches</strong>Try a shorter search or a barcode.</div>`}</div></section><section class="panel detail">${chosen?itemDetail(chosen):'<div class="empty"><strong>Select an item</strong>Choose an item to see its details.</div>'}</section></div>`;document.querySelector('#search').addEventListener('input',e=>{query=e.target.value;renderInventory();document.querySelector('#search').focus();document.querySelector('#search').setSelectionRange(query.length,query.length)})}
function itemDetail(item){return `<div class="detail-toolbar"><button class="button back mobile-only" onclick="document.querySelector('#split').classList.remove('mobile-detail')">← Back to results</button><span class="status ${item.status==='Checked out'?'out':''}">${item.status}</span><button class="button" onclick="toast('Editing is a later part of this concept.')">Edit item</button></div><div class="hero"><div class="hero-art" >${itemMarker(item.name)}</div><div><div class="result-sub">${item.id} · ${item.category}</div><h2>${escapeHtml(item.name)}</h2><p>${escapeHtml(item.location)}</p></div></div><div class="facts"><div><div class="fact-label">Barcode</div><div class="fact-value">${item.barcode}</div></div><div><div class="fact-label">Condition</div><div class="fact-value">Good</div></div><div><div class="fact-label">Availability</div><div class="fact-value">${item.status}</div></div></div><div class="section-title"><h3>Notes</h3><button class="button soft" onclick="openNote('${item.id}')">＋ Add note</button></div><div id="note-editor"></div><div id="notes">${item.notes.length?[...item.notes].reverse().map(n=>`<article class="note"><div class="note-meta"><span class="avatar">${n.author[0]}</span><strong>${escapeHtml(n.author)}</strong><time>${escapeHtml(n.time)}</time></div><div>${escapeHtml(n.text)}</div></article>`).join(''):'<div class="empty" style="padding:24px 0"><strong>No notes yet</strong>Add a note to keep useful history with this item.</div>'}</div>`}
function selectItem(id){selectedId=id;renderInventory();document.querySelector('#split').classList.add('mobile-detail')}
function openNote(id){document.querySelector('#note-editor').innerHTML=`<div style="display:grid;gap:9px;margin-bottom:10px"><textarea id="new-note" rows="3" placeholder="Add a useful detail for the next person…"></textarea><div class="actions" style="margin:0"><button class="button" onclick="document.querySelector('#note-editor').innerHTML=''">Cancel</button><button class="button primary" onclick="saveNote('${id}')">Save note</button></div></div>`;document.querySelector('#new-note').focus()}
function saveNote(id){const box=document.querySelector('#new-note'),text=box.value.trim();if(!text){box.focus();return}const item=items.find(x=>x.id===id);item.notes.push({text,author:'You',time:noteDate()});renderInventory();toast('Note added to this demo item.')}
function renderLocations(){const loc=locations.find(l=>l.name===selectedLocation)||locations[0];main.innerHTML=`<div class="heading"><div><h1>Locations</h1><p>Browse storage areas and what is kept there.</p></div></div><div class="split"><section class="panel list-panel"><div class="list-top"><div class="list-count">${locations.length} locations</div></div><div class="item-list">${locations.map(l=>`<button class="result ${l.name===loc.name?'selected':''}" onclick="selectLocation('${l.name}')"><span class="thumb" >${locationMarker(l.name)}</span><span class="result-copy"><span class="result-name">${l.name}</span><span class="result-sub">${l.detail}</span></span><span class="status">${l.count}</span></button>`).join('')}</div></section><section class="panel detail"><div class="detail-toolbar"><span class="status">${loc.count} items</span><button class="button" onclick="toast('Location editing is a later part of this concept.')">Edit location</button></div><div class="hero"><div class="hero-art" >${locationMarker(loc.name)}</div><div><div class="result-sub">Storage location</div><h2>${loc.name}</h2><p>${loc.detail}</p></div></div><div class="section-title"><h3>Items here</h3><span class="list-count">${loc.count} total</span></div><div class="location-contents">${loc.items.map((name,i)=>`<div class="location-row"><span>${escapeHtml(name)}</span><span>${i===0?'Available':'Stored here'}</span></div>`).join('')}<button class="button" style="justify-self:start;margin-top:8px" onclick="setPage('inventory')">Browse all inventory</button></div></section></div>`}
function selectLocation(name){selectedLocation=name;renderLocations()}
function renderCreate(){if(savedItem){main.innerHTML=`<section class="panel success"><div class="success-mark">✓</div><h2>Item added to this demo</h2><p>${escapeHtml(savedItem.name)} is shown in this mockup only. No inventory was changed.</p><div class="actions"><button class="button" onclick="savedItem=null;setPage('inventory')">View inventory</button><button class="button primary" onclick="savedItem=null;renderCreate()">Create another</button></div></section>`;return}main.innerHTML=`<div class="heading"><div><h1>Create item</h1><p>Add the essentials first. The rest can wait until you need it.</p></div></div><form class="panel form-panel" id="create-form"><div class="form-grid"><div class="field span2"><label for="item-name">Item name</label><input id="item-name" required placeholder="e.g. Cordless drill"><small>Use the name people will look for.</small></div><div class="field"><label for="category">Category</label><select id="category"><option>Power tools</option><option>Hand tools</option><option>Measuring</option><option>Lighting</option><option>Other</option></select></div><div class="field"><label for="location">Location</label><select id="location">${locations.map(l=>`<option>${l.name}</option>`).join('')}</select></div><div class="field span2"><label>Photo</label><div class="photo-zone"><div class="photo-preview" id="photo-preview">No photo</div><div><strong>Add an item photo</strong><p class="hint">A photo makes visual matching easier.</p><input id="photo" type="file" accept="image/*" aria-label="Choose item photo"></div></div></div></div><details class="details-toggle"><summary>More details</summary><div class="form-grid" style="margin-top:17px"><div class="field"><label for="barcode">Barcode</label><input id="barcode" placeholder="Scan or type a barcode"></div><div class="field"><label for="condition">Condition</label><select id="condition"><option>Good</option><option>Needs attention</option><option>New</option></select></div><div class="field span2"><label for="description">Description</label><textarea id="description" rows="3" placeholder="Optional details"></textarea></div><div class="field span2"><label for="first-note">First note</label><textarea id="first-note" rows="2" placeholder="Notes are timestamped when saved"></textarea></div></div></details><div class="actions"><button type="button" class="button" onclick="setPage('inventory')">Cancel</button><button class="button primary large" type="submit">Create item</button></div></form>`;document.querySelector('#create-form').addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#item-name').value.trim();if(!name)return;const loc=document.querySelector('#location').value;const item={id:'DEMO-'+String(items.length+1).padStart(3,'0'),name,category:document.querySelector('#category').value,location:loc,status:'Available',barcode:document.querySelector('#barcode').value||'Not set',notes:[]};const note=document.querySelector('#first-note').value.trim();if(note)item.notes.push({text:note,author:'You',time:noteDate()});items.unshift(item);selectedId=item.id;savedItem=item;renderCreate()});document.querySelector('#photo').addEventListener('change',e=>{const file=e.target.files[0];if(file){const url=URL.createObjectURL(file);document.querySelector('#photo-preview').innerHTML=`<img alt="Selected item photo" src="${url}">`}})}
function renderFlow(){const isReturn=page==='return',noun=isReturn?'return':'check out',title=isReturn?'Return an item':'Check out an item';main.innerHTML=`<div class="heading"><div><h1>${title}</h1><p>A clear review step before anything is confirmed.</p></div><button class="button" onclick="setPage('inventory')">Leave flow</button></div><div class="flow"><div class="flow-progress"><span class="${flow.step===0?'current':''}">Badge</span><span>›</span><span class="${flow.step===1?'current':''}">Item</span><span>›</span><span class="${flow.step===2?'current':''}">Review</span></div><section class="panel flow-card" id="flow-card">${flowContent(isReturn,noun)}</section></div>`;wireFlow(isReturn)}
function flowContent(isReturn,noun){if(flow.step===0)return `<h2>Scan your badge</h2><p>Use the badge scanner or type a demo badge number.</p><form id="badge-form"><div class="scanbox"><span class="scan-symbol">▤</span><input id="badge-input" autocomplete="off" autofocus placeholder="Scan badge here" aria-label="Badge number"><button class="button primary large">Continue</button></div></form><div class="hint">Demo badges: 10042, 10087. Press Enter after scanning.</div>`;if(flow.step===1)return `<h2>Scan an item to ${noun}</h2><p>Check the item name before you continue.</p><form id="item-form"><div class="scanbox"><span class="scan-symbol">⌕</span><input id="item-input" autocomplete="off" placeholder="Scan item barcode" aria-label="Item barcode"><button class="button primary large">Find item</button></div></form><div class="hint">Try a demo barcode: 49029-18, 49029-33, or search by item name.</div><div id="flow-error"></div><div class="flow-footer"><button class="button" onclick="flow.step=0;renderFlow()">← Back</button><button class="button" onclick="setPage('inventory')">Cancel ${isReturn?'return':'check out'}</button></div>`;if(flow.step===2){const item=flow.item;return `<h2>Review ${isReturn?'return':'check out'}</h2><p>Confirm the details before completing this demo action.</p><div class="review-item"><span class="thumb" >${itemMarker(item.name)}</span><div><strong>${escapeHtml(item.name)}</strong><p>${item.id} · ${item.location}</p></div><span class="status ${isReturn?'':'out'}">${isReturn?'Returning':'Checking out'}</span></div><div class="facts"><div><div class="fact-label">Member</div><div class="fact-value">Badge ${escapeHtml(flow.badge)}</div></div><div><div class="fact-label">Item status</div><div class="fact-value">${item.status}</div></div><div><div class="fact-label">Next step</div><div class="fact-value">${isReturn?'Back to '+item.location:'Return to workshop'}</div></div></div><div class="warning">This is a preview. Confirming creates a mock receipt in this browser only.</div><div class="flow-footer"><button class="button" onclick="flow.step=1;renderFlow()">← Back to scan</button><div class="toolbar"><button class="button danger" onclick="setPage('inventory')">Cancel ${isReturn?'return':'check out'}</button><button class="button primary large" onclick="confirmFlow()">Confirm ${isReturn?'return':'check out'}</button></div></div>`}return `<div class="success-mark">✓</div><h2>${isReturn?'Return':'Checkout'} recorded in demo</h2><p>No live inventory or member account was changed.</p><div class="review-item"><span class="thumb" >${itemMarker(flow.item.name)}</span><div><strong>${escapeHtml(flow.item.name)}</strong><p>Mock receipt · Badge ${escapeHtml(flow.badge)}</p></div></div><div class="actions"><button class="button primary" onclick="setPage('${page}')">Start another</button><button class="button" onclick="setPage('inventory')">Back to inventory</button></div>`}
function wireFlow(isReturn){const badge=document.querySelector('#badge-form');if(badge)badge.addEventListener('submit',e=>{e.preventDefault();const value=document.querySelector('#badge-input').value.trim();if(!value){toast('Scan or enter a demo badge first.');return}flow.badge=value;flow.step=1;renderFlow();document.querySelector('#item-input').focus()});const itemForm=document.querySelector('#item-form');if(itemForm)itemForm.addEventListener('submit',e=>{e.preventDefault();const value=document.querySelector('#item-input').value.trim().toLowerCase();const item=items.find(x=>x.barcode.toLowerCase()===value||x.id.toLowerCase()===value||x.name.toLowerCase().includes(value));const error=document.querySelector('#flow-error');if(!item){error.innerHTML='<div class="warning">No matching demo item. Check the barcode or try an item name.</div>';return}if(!isReturn&&item.status==='Checked out'){error.innerHTML='<div class="warning">This item is already checked out. Review its current status in inventory.</div>';return}if(isReturn&&item.status!=='Checked out'){error.innerHTML='<div class="warning">This item is listed as available. Check its status before returning.</div>';return}flow.item=item;flow.step=2;renderFlow()})}
function confirmFlow(){if(page==='return')flow.item.status='Available';else flow.item.status='Checked out';flow.step=3;renderFlow()}
function toast(message){const el=document.querySelector('#notice');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
initThemePicker();
render();
</script>
</body>
</html>
